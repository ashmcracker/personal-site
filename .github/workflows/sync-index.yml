name: Sync Index

# 任何 HTML 变更都会触发：重新扫描仓库并把结果写回 index.html 的目录页。
# 只改 Markdown 时不跑，省一次无意义的 Actions。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-index
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史来读取文件最后提交时间

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate index
        run: python scripts/gen_index.py

      - name: Commit updated index
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "index.html 无变化，无需提交。"
            exit 0
          fi
          git add index.html
          git commit -m "chore: sync index"
          git push