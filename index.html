<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ashm's Corner · 个人笔记与文档</title>
<meta name="description" content="个人学习笔记、技术文档与实验记录的静态站点。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📓</text></svg>">
<style>
:root{
  --bg:#0d1117; --bg2:#161b22; --card:#1c2129; --line:#30363d;
  --tx:#e6edf3; --tx2:#9aa7b4; --tx3:#6e7b8a;
  --ac:#58a6ff; --gr:#3fb950; --or:#d29922; --pp:#bc8cff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  font-size:14px;line-height:1.65;
  -webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 400px at 15% -10%,rgba(88,166,255,.13),transparent 60%),
             radial-gradient(760px 380px at 88% 0%,rgba(188,140,255,.11),transparent 62%)}
.wrap{max-width:1000px;margin:0 auto;padding:56px 20px 72px}
a{color:inherit;text-decoration:none}

/* hero */
.hero{display:flex;gap:20px;align-items:flex-start;margin-bottom:34px}
.avatar{flex:0 0 60px;width:60px;height:60px;border-radius:16px;display:grid;place-items:center;
  font-weight:700;font-size:22px;letter-spacing:1px;color:#fff;
  background:linear-gradient(135deg,var(--ac),var(--pp));
  box-shadow:0 8px 26px rgba(88,166,255,.25)}
h1{font-size:27px;margin:0 0 4px;letter-spacing:.4px}
.tagline{color:var(--tx2);margin:0 0 12px;font-size:13.5px}
.stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--tx3);font-size:12.5px}
.stats b{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums}

/* toolbar */
.toolbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:12px 0;margin-bottom:8px;
  background:rgba(13,17,23,.9);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
#q{flex:1;max-width:380px;background:var(--bg2);color:var(--tx);border:1px solid var(--line);
  border-radius:8px;padding:8px 12px;font-size:13px;font-family:inherit;outline:none}
#q:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(88,166,255,.14)}
#q::placeholder{color:var(--tx3)}
.hint{margin-left:auto;color:var(--tx3);font-size:12px;font-variant-numeric:tabular-nums}

/* sections */
.group{margin:30px 0 8px;display:flex;align-items:center;gap:12px}
.group h2{font-size:13px;margin:0;color:var(--or);letter-spacing:1.2px;
  text-transform:uppercase;white-space:nowrap}
.group .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.group .n{color:var(--tx3);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}

/* card */
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;
  transition:border-color .18s,transform .18s,box-shadow .18s;overflow:hidden}
.note:hover{border-color:var(--ac);transform:translateY(-2px);
  box-shadow:0 10px 26px rgba(1,4,9,.45)}
.note:hover .title{color:var(--ac)}
.note-inner{display:block;padding:15px 16px 14px}
.note-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.title{font-size:14.5px;font-weight:600;margin:0;line-height:1.45;word-break:break-word}
.chip{flex:0 0 auto;margin-left:auto;font-size:11px;color:var(--tx2);background:var(--bg2);
  border:1px solid var(--line);border-radius:99px;padding:1px 9px;white-space:nowrap}
.desc{color:var(--tx2);font-size:12.5px;margin:0 0 11px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--tx3);font-size:11.5px;align-items:center}
.meta code{background:var(--bg2);border:1px solid var(--line);border-radius:5px;
  padding:1px 6px;color:var(--tx2);font-size:11px;word-break:break-all}
.empty{text-align:center;color:var(--tx3);padding:56px 20px;font-size:13.5px}

footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);
  color:var(--tx3);font-size:12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
footer a{color:var(--tx2)}
footer a:hover{color:var(--ac)}

@media(max-width:640px){
  .wrap{padding:34px 16px 56px}
  .hero{gap:14px}.avatar{flex-basis:48px;width:48px;height:48px;font-size:18px;border-radius:13px}
  h1{font-size:22px}
  .hint{display:none}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="avatar">AT</div>
    <div>
      <h1>Ashm's Corner</h1>
      <p class="tagline">学习笔记 · 技术文档 · 实验记录 —— 把散落的学习产物集中沉淀在这里。</p>
      <div class="stats">
        <span><b id="stat-docs">0</b>&nbsp;篇文档</span>
        <span><b id="stat-groups">0</b>&nbsp;个分类</span>
        <span>GitHub&nbsp;Pages 托管</span>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <input id="q" type="search" placeholder="搜索标题、描述或路径…" autocomplete="off">
    <span class="hint" id="count"></span>
  </div>

  <main id="list">
<!-- NOTES:START -->
<div class="group"><h2>notes</h2><span class="rule"></span><span class="n">1 篇</span></div>
<div class="grid">
<article class="note" data-search="terraform 课程知识地图 · 学习进度 按「先地基 → 再语言 → 再规模化 → 最后团队协作」的顺序纵向串联 20 个章节、229 个知识点。勾选即可记录进度（存在本地浏览器）。 notes/terraform-learning-roadmap.html notes"><a class="note-inner" href="notes/terraform-learning-roadmap.html"><div class="note-head"><h3 class="title">Terraform 课程知识地图 · 学习进度</h3><span class="chip">notes</span></div><p class="desc">按「先地基 → 再语言 → 再规模化 → 最后团队协作」的顺序纵向串联 20 个章节、229 个知识点。勾选即可记录进度（存在本地浏览器）。</p><div class="meta"><code>notes/terraform-learning-roadmap.html</code><span>138.6 KB</span><span>2026-10-11</span></div></a></article>
</div>
<!-- NOTES:END -->
  </main>

  <footer>
    <span>由 GitHub Pages 托管 · <span id="year"></span></span>
    <a href="https://github.com/ashmcracker/personal-site" target="_blank" rel="noopener">GitHub 源码</a>
    <a href="https://github.com/ashmcracker/personal-site/blob/main/README.md" target="_blank" rel="noopener">如何添加笔记</a>
  </footer>

</div>

<script>
(function(){
  var y=document.getElementById('year');
  if(y) y.textContent=new Date().getFullYear();

  var input=document.getElementById('q');
  var list=document.getElementById('list');
  var count=document.getElementById('count');
  var notes=Array.prototype.slice.call(list.querySelectorAll('.note'));
  var groups=Array.prototype.slice.call(list.querySelectorAll('.group'));
  var empty=document.createElement('p');
  empty.className='empty';
  empty.textContent='没有匹配的文档，换个关键词试试。';
  empty.style.display='none';
  list.appendChild(empty);

  function apply(){
    var q=(input.value||'').trim().toLowerCase();
    var visible=0;
    notes.forEach(function(n){
      var hit=!q||n.dataset.search.indexOf(q)>-1;
      n.style.display=hit?'':'none';
      if(hit) visible++;
    });
    groups.forEach(function(g){
      var cards=g.querySelectorAll('.note');
      var any=false;
      Array.prototype.forEach.call(cards,function(c){
        if(c.style.display!=='none') any=true;
      });
      g.style.display=any?'':'none';
      var badge=g.querySelector('.n');
      if(badge){
        var shown=Array.prototype.filter.call(cards,function(c){
          return c.style.display!=='none';
        }).length;
        badge.textContent=shown+' 篇';
      }
    });
    empty.style.display=visible?'none':'';
    count.textContent=(q?visible+' / '+notes.length:notes.length+' 篇文档');
  }

  input.addEventListener('input',apply);
  apply();

  var stat=document.getElementById('stat-docs');
  if(stat) stat.textContent=notes.length;
  var sg=document.getElementById('stat-groups');
  if(sg) sg.textContent=groups.length;
})();
</script>
</body>
</html>
