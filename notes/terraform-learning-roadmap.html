 驱动项目初始化","d":"新建 project-05/tf-cloud-oidc 目录，用 terraform login 生成有效期 30 天的 API token；写 provider.tf 绑定到 default workspace，运行 terraform init 与 terraform workspace show 确认生效。"},{"t":"配置 Variable Set","d":"TFC 侧只需两个环境变量：TFC_AWS_PROVIDER_AUTH 设为 true，TFC_AWS_RUN_ROLE_ARN 填角色 ARN；配好后重跑 plan/apply 就能以该角色认证到 AWS，不存储任何静态密钥。"},{"t":"导入三个 AWS 资源","d":"用 import 块接管 aws_iam_openid_connect_provider（需 url、client_id_list、thumbprint_list）、aws_iam_role（用 data aws_iam_policy_document 写 assume policy）与 aws_iam_role_policy_attachment。"},{"t":"扩展到第二个 workspace","d":"在同一项目下新建 terraform-cli-2，项目级 Variable Set 会自动应用到新 workspace；若再在 workspace 级挂同名变量集，其取值会覆盖项目级，正好可用于多环境隔离。"},{"t":"收尾与资源清理","d":"验证 plan/apply 通过后，删掉本地测试目录、oidc-admin-role 变量集，以及项目下的 workspace 和整个项目，确保 AWS 与 Terraform Cloud 两侧都不留残留。"}],"goal":"用 OIDC 让 TFC 动态 assume AWS 角色，并把已有 AWS 资源导入 Terraform 管理","lessons":[{"i":224,"t":"Project Overview","ex":false,"n":"项目目标是学会在 Terraform Cloud 中启用 OIDC 完成 AWS 认证，用短期凭证替代长期访问密钥。流程是：先在 AWS 手动创建 IdP 与角色，让 TFC 中的 workspace 成功通过 OIDC 认证，再把已有 AWS 资源导入 Terraform 管理，最后扩展配置让第二个 workspace 也能 assume 该角色。"},{"i":225,"t":"Creating the Identity Provider in AWS","ex":false,"n":"进入安全凭证页，停用并删除此前给 TFC 用的长期访问密钥，确保旧配置彻底失效。然后在 AWS 侧创建身份提供商：Web identity 类型、provider 选 app.terraform.io 并指定 audience，记下它的 ARN。注意 provider 建好后还不能直接 assume 任何角色，页面也会提示必须先分配 IAM 角色。"},{"i":226,"t":"Implementing the Terraform Cloud Role","ex":false,"n":"在 IAM 的 Roles 里 Create Role：受信实体类型选 Web identity（而非 AWS 服务），provider 选 app.terraform.io 并选择 audience，附加 AdministratorAccess，角色命名 Terraform-Cloud-Automation-Admin。随后检查生成的信任策略，确认已包含 OIDC provider 的 ARN 与 app.terraform.io:sub 条件，限定组织、项目、default workspace 及 run phase，让 plan 和 apply 两阶段都能 assume，改完点 Update policy。"},{"i":227,"t":"Attaching the Necessary Role Policies","ex":false,"n":"在角色的 Permissions 中选 Add permissions → Attach policies，挂上 AdministratorAccess；因为对谁能 assume 已做了严格限制，这样做是安全的。总结 AWS 侧三步：创建来自 Terraform 的 identity provider、指定 audience、在角色中引用该 provider，这就是 OIDC 在 AWS 的实际形态。该 provider 随后用于 assume 角色，凭证最长有效期仅一小时。"},{"i":228,"t":"Initializing the Terraform Cloud CLI-Driven Project","ex":false,"n":"在 Terraform 根项目下新建 project-05 里的 tf-cloud-oidc 目录，运行 terraform login（在哪执行不重要，登录对整个本地环境生效），输入 yes 后创建有效期 30 天、名为 terraform-cloud 的 API token。接着写 provider.tf，切到该目录运行 terraform init，用 terraform workspace show 确认当前是 default；由于 default 是 CLI 默认使用的 workspace，需要在 TFC 里另建可用 workspace，随后会遇到 No valid credential sources found。"},{"i":229,"t":"Creating Variable Sets for Role Information","ex":false,"n":"在 TFC 侧只需两个环境变量：TFC_AWS_PROVIDER_AUTH 设为 true，TFC_AWS_RUN_ROLE_ARN 填入角色 ARN（可设为敏感或明文，取决于组织策略）。在 CLI 中输入 yes 批准后重跑 plan，这次顺利通过，说明 Terraform 已能以该角色认证到 AWS；再执行 terraform apply（会先初始化插件与模块）确认能真正创建资源。"},{"i":230,"t":"Importing the OIDC Provider into Terraform","ex":false,"n":"开始把已有 AWS 资源导入 Terraform，先从 identity provider 入手。aws_iam_openid_connect_provider 需要三项信息：URL 填 https://app.terraform.io、client_id_list（即 audience / client ID 列表）、thumbprint_list。新建 oidc.tf 写资源引用这三项，并加 import 块，import ID 用文档要求的 provider ARN，最后 terraform fmt、terraform init 后 apply 完成导入。"},{"i":231,"t":"Importing the Role into Terraform","ex":false,"n":"先说 thumbprint：除只取第 0 个证书外，也可用 splat 表达式取所有证书的 SHA-1 指纹（本例会多出三个），讲师选择只保留控制台创建时实际取到的那个，并放弃这次 apply。随后新建 aws_iam_role terraform_cloud_admin，用 data.aws_iam_policy_document 写 statement，identifiers 引用 aws_iam_openid_connect_provider.terraform_cloud.arn 并加上 variable 条件，最后写 import 块导入角色。"},{"i":232,"t":"Importing the Policy Attachment into Terraform","ex":false,"n":"最后一步是导入附加到角色上的策略。在角色的 Permissions 下复制 aws_iam_role_policy_attachment 的名称，回到 IDE 新建该资源块：role 写 aws_iam_role.terraform_cloud_admin.name，policy_arn 不硬编码而通过数据源获取，写成 data.aws_iam_policy.admin.arn（因为配置里并没有创建 aws_iam_policy 资源），再按文档格式补上 import 块完成导入。"},{"i":233,"t":"Extending the OIDC Provider to Allow Other Workspaces + Project Wrap-Up","ex":false,"n":"做几个验证测试：在 terraform-oidc 项目下新建 CLI 驱动的 terraform-cli-2，因变量集在 Settings 的 Variable Sets 里应用到了整个项目，新 workspace 自动继承变量；若在 workspace 级应用同名变量集则优先级更高，可覆盖项目级取值。本地建 test-folder 复用 provider.tf 只把 workspace 改为 terraform-cli-2，验证能否 assume 角色。最后删除测试目录、oidc-admin-role 变量集、项目与 workspace，恢复干净状态。"}]},{"n":20,"dir":"20 - Conclusion","stage":"阶段 9 · 收尾","zh":"课程总结","points":[{"t":"全流程回顾","d":"原课程在此未提供讲解视频。建议自行把前三阶段串起来回顾：state 是唯一事实来源，module 是复用单元，workspace 与 Terraform Cloud 是协作与隔离手段。"},{"t":"后续学习路径建议","d":"可接续的方向：Terraform Cloud 私有 Registry、多环境流水线拆分、Terraform Cloud OIDC 免密钥、Terratest 模块单元测试，以及跨云的 Crossplane / Kubernetes Operator。"}],"goal":"原课程此节没有配套视频，作为整门课复盘与后续规划的占位","lessons":[]}];
const KEY='tf-course-progress-v1';
let done = JSON.parse(localStorage.getItem(KEY)||'{}');
const key=(c,l)=>c+'.'+l;
function isDone(c,l){return !!done[key(c,l)];}
function save(){localStorage.setItem(KEY,JSON.stringify(done));}

function build(){
  const tree=document.getElementById('tree');
  let html='',lastStage=null;
  DATA.forEach(c=>{
    if(c.stage!==lastStage){
      lastStage=c.stage;
      html+=`<div class="stage"><h2>${c.stage}</h2><div class="rule"></div></div>`;
    }
    html+=`<div class="node" id="n${c.n}" data-n="${c.n}">
      <div class="card">
        <div class="chead" onclick="toggle(${c.n})">
          <span class="arrow">▶</span>
          <span class="num">${String(c.n).padStart(2,'0')}</span>
          <span class="ctitle">
            <div class="cname">${c.zh}<span>${c.dir.replace(/^\d+ - /,'')}</span></div>
            <div class="goal">🎯 ${c.goal}</div>
          </span>
          <span class="badge" id="b${c.n}">0/${c.lessons.length}</span>
        </div>
        <div class="cbody">
          <div class="points"><ul>${c.points.map(p=>{const t=typeof p==='string'?p:(p.t||'');const d=(typeof p==='string'?'':p.d)||'';return `<li><span class="pt">${t}</span>${d?`<span class="pd">${d}</span>`:''}</li>`}).join('')}</ul></div>
          <div class="sub">知识点顺序（点左侧序号可跳转，勾选记录进度）</div>
          <ul class="lessons" id="l${c.n}">
            ${c.lessons.map(l=>`<li data-n="${c.n}" data-l="${l.i}" class="${l.ex?'ex':''}" onclick="tog(${c.n},${l.i},this)">
              <span class="cb"></span><span class="lid">${l.i}</span><span style="flex:1"><span class="li">${l.t}</span>${l.n?`<div class="lnote">${l.n}</div>`:''}</span></li>`).join('')}
          </ul>
          <div class="lids" id="g${c.n}">${c.lessons.map(l=>`<b data-n="${c.n}" data-l="${l.i}" onclick="tog(${c.n},${l.i})">${l.i}</b>`).join('')}</div>
          <div class="todo"><label style="cursor:pointer" onclick="markChapter(this)"><input type="checkbox" id="cx${c.n}"> 本章全部标记完成</label><span>· 第 ${c.n} 章</span></div>
        </div>
      </div>
    </div>`;
  });
  tree.innerHTML=html;
}

function toggle(n){document.getElementById('n'+n).classList.toggle('open');}

function tog(c,l,el){
  const k=key(c,l);
  if(done[k]) delete done[k]; else done[k]=1;
  save(); paint();
}
function markChapter(src){
  // 仅在章节内的 checkbox 上调用：整章全选 / 全不选
  const n=src.id.replace('cx',''), ch=DATA.find(c=>String(c.n)===n);
  if(!ch) return;
  ch.lessons.forEach(l=>{ src.checked?done[key(n,l.i)]=1:delete done[key(n,l.i)]; });
  save(); paint();
}
function expandAll(v){DATA.forEach(c=>document.getElementById('n'+c.n).classList.toggle('open',!!v));}
function resetAll(){if(confirm('确定清空全部学习进度？')){done={};save();paint();}}

function paint(){
  let t=0,d=0,e=0,ep=0;
  DATA.forEach(c=>{
    let cd=0,ce=0;
    c.lessons.forEach(l=>{
      t++;
      const on=isDone(c.n,l.i);
      if(on){d++;cd++;}
      if(l.ex){e++;if(on)ce++;}
    });
    const li=document.querySelector(`#l${c.n} li[data-l]`);
    document.querySelectorAll(`#l${c.n} li`).forEach(el=>el.classList.toggle('on',isDone(c.n,+el.dataset.l)));
    document.querySelectorAll(`#g${c.n} b`).forEach(el=>el.classList.toggle('on',isDone(c.n,+el.dataset.l)));
    const b=document.getElementById('b'+c.n);
    b.textContent=cd+'/'+c.lessons.length;
    b.className='badge'+(cd===c.lessons.length?' ok':cd>0?' half':'');
    const cx=document.getElementById('cx'+c.n); if(cx) cx.checked=(cd===c.lessons.length);
    const nd=document.getElementById('n'+c.n);
    nd.classList.toggle('done',cd===c.lessons.length);
    nd.classList.toggle('part',cd>0&&cd<c.lessons.length);
  });
  const p=t?Math.round(d/t*100):0;
  document.getElementById('pct').innerHTML=p+'%<small>'+d+' / '+t+'</small>';
  document.getElementById('fill').style.width=p+'%';
  const pe=e?Math.round(ep/e*100):0;
  document.getElementById('exfill').style.width=pe+'%';
  const cur=DATA.find(c=>c.lessons.some(l=>!isDone(c.n,l.i)));
  document.getElementById('stg').textContent = cur? `下一站：${cur.n}. ${cur.zh}` : '🎉 全部章节已完成！';
}

build(); paint();
</script>
</body>
</html>
