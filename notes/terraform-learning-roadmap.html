<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terraform 课程知识地图 · 学习进度</title>
<style>
:root{
  --bg:#0d1117; --bg2:#161b22; --card:#1c2129; --line:#30363d;
  --tx:#e6edf3; --tx2:#9aa7b4; --tx3:#6e7b8a;
  --ac:#58a6ff; --gr:#3fb950; --or:#d29922; --pp:#bc8cff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;font-size:14px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px}

header h1{font-size:24px;margin:0 0 6px;letter-spacing:.5px}
header p{color:var(--tx2);margin:0 0 20px;font-size:13px}

.bar{position:sticky;top:0;z-index:20;background:rgba(13,17,23,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 0 12px;margin-bottom:22px}
.bar-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:9px}
.pct{font-size:26px;font-weight:700;color:var(--gr);letter-spacing:.5px}
.pct small{font-size:13px;color:var(--tx2);font-weight:400;margin-left:6px}
.meta{color:var(--tx2);font-size:12px}
.tools{margin-left:auto;display:flex;gap:8px}
button{background:var(--card);color:var(--tx2);border:1px solid var(--line);
  border-radius:6px;padding:5px 11px;cursor:pointer;font-size:12px;font-family:inherit}
button:hover{color:var(--tx);border-color:var(--ac)}
.track{height:9px;background:var(--bg2);border-radius:99px;overflow:hidden;display:flex}
.fill{background:linear-gradient(90deg,#2ea043,#3fb950);width:0;transition:width .35s ease}
.fill.blue{background:linear-gradient(90deg,#1f6feb,#58a6ff)}
.exbar{height:5px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:6px}
.exbar div{background:linear-gradient(90deg,#8957e5,#bc8cff);height:100%;width:0;transition:width .35s}

/* stage */
.stage{margin:30px 0 8px;display:flex;align-items:center;gap:12px}
.stage h2{font-size:15px;margin:0;color:var(--or);letter-spacing:1px;white-space:nowrap}
.stage .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

.node{position:relative;margin:16px 0 16px 26px;padding-left:26px;border-left:2px solid var(--line)}
.node::before{content:'';position:absolute;left:-8px;top:22px;width:14px;height:14px;
  border-radius:50%;background:var(--bg);border:2px solid var(--tx3)}
.node.done::before{background:var(--gr);border-color:var(--gr)}
.node.part::before{background:var(--or);border-color:var(--or)}

.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.chead{display:flex;align-items:center;gap:12px;padding:13px 15px;cursor:pointer;user-select:none}
.chead:hover{background:#1b212b}
.num{font-weight:700;color:var(--ac);font-size:13px;min-width:34px;font-variant-numeric:tabular-nums}
.ctitle{flex:1}
.cname{font-weight:600;font-size:14.5px}
.cname span{color:var(--tx3);font-weight:400;font-size:12.5px;margin-left:8px}
.goal{color:var(--tx2);font-size:12px;margin-top:2px}
.badge{font-size:11px;color:var(--tx2);background:var(--card);border:1px solid var(--line);
  border-radius:99px;padding:2px 9px;white-space:nowrap;font-variant-numeric:tabular-nums}
.badge.ok{color:var(--gr);border-color:#1d572a}
.badge.half{color:var(--or);border-color:#5c4813}
.cbody{display:none;padding:0 15px 15px;border-top:1px solid var(--line)}
.node.open .cbody{display:block}
.arrow{color:var(--tx3);transition:transform .2s;font-size:11px}
.node.open .arrow{transform:rotate(90deg)}

.points{margin:12px 0 14px;padding:12px 14px;background:var(--card);border-radius:8px;
  border-left:3px solid var(--ac)}
.points ul{margin:0;padding-left:18px;columns:2;column-gap:26px}
.points li{font-size:12.8px;color:var(--tx2);margin-bottom:9px;break-inside:avoid}
.points li::marker{color:var(--ac)}
.pt{color:var(--tx);font-weight:600}
.pd{display:block;color:var(--tx3);font-size:11.8px;line-height:1.55;margin-top:2px}

.sub{margin:14px 0 6px;font-size:12px;color:var(--tx3);letter-spacing:1px;text-transform:uppercase}
ul.lessons{list-style:none;margin:0;padding:0}
ul.lessons li{display:flex;align-items:flex-start;gap:9px;padding:6px 8px;border-radius:6px;cursor:pointer}
ul.lessons li:hover{background:var(--card)}
ul.lessons li.on{color:var(--tx3);text-decoration:line-through}
.cb{width:15px;height:15px;border:1.5px solid var(--tx3);border-radius:4px;flex:0 0 auto;margin-top:4px;
  display:flex;align-items:center;justify-content:center;font-size:10px;color:#0d1117}
li.on .cb{background:var(--gr);border-color:var(--gr)}
li.on .cb::after{content:'✓';font-weight:700}
.li{font-size:13px}
.lnote{font-size:11.8px;color:var(--tx2);margin-top:1px}
li.ex .li::before{content:'练习';font-size:9.5px;color:var(--pp);border:1px solid #4c2d6b;
  border-radius:4px;padding:0 4px;margin-right:7px;vertical-align:1px}
.lid{color:var(--tx3);font-size:11.5px;font-variant-numeric:tabular-nums;min-width:30px}
.lids{display:flex;flex-wrap:wrap;gap:3px;margin-top:9px}
.lids b{font-weight:400;font-size:10px;font-family:Consolas,monospace;color:var(--tx3);
  background:var(--card);border:1px solid var(--line);border-radius:3px;padding:1px 3px;cursor:pointer}
.lids b:hover{color:var(--ac);border-color:var(--ac)}
.lids b.on{background:#1d572a;color:#7ee787;border-color:#1d572a}
.todo{margin-top:12px;font-size:11.5px;color:var(--tx3);display:flex;align-items:center;gap:8px}
.hint{font-size:12px;color:var(--tx3);margin:6px 0 16px}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--tx3);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Terraform 完整课程 · 知识地图与学习进度</h1>
  <p>按「先地基 → 再语言 → 再规模化 → 最后团队协作」的顺序纵向串联 20 个章节、229 个知识点。勾选即可记录进度（存在本地浏览器）。</p>
</header>

<div class="bar">
  <div class="bar-top">
    <span class="pct" id="pct">0%<small id="cnt">0 / 229</small></span>
    <span class="meta" id="stg"></span>
    <span class="tools">
      <button onclick="expandAll(1)">展开全部</button>
      <button onclick="expandAll(0)">收起全部</button>
      <button onclick="resetAll()">重置进度</button>
    </span>
  </div>
  <div class="track"><div class="fill" id="fill"></div></div>
  <div class="exbar" title="练习完成率"><div id="exfill"></div></div>
</div>

<div id="tree"></div>
<p class="hint">💡 学习节奏建议：按阶段顺序推进，每章的「任务预览」先看一遍再动手写代码；练习全部自己敲一遍，比看十遍讲解更有效。</p>
<footer>Terraform - The Complete Guide from Beginner to Expert · 共 229 节 · 进度保存在本机 localStorage</footer>
</div>

<script>
const DATA = [{"n":1,"dir":"1 - Introduction","stage":"阶段 0 · 起步","zh":"课程介绍与导航","points":[{"t":"课程地图与三段式结构","d":"从基础设施即代码的价值与最佳实践讲起，先过 HashiCorp 配置语言，再学资源块、数据源、输入变量、本地变量与输出；高级部分进入工作区、对象验证、模块与状态操作，最后覆盖 Terraform Cloud。"},{"t":"练习代码与仓库资源位置","d":"课程由三个 GitHub 仓库组成，主仓库按章节建文件夹，模块章节拆成三个便于分离练习；练习文件夹列出全部可用练习，练习文件在每节课的资源区也能下载。"}],"goal":"了解课程范围、三段式结构与配套仓库，把 60 多个练习和 5 个项目的用法记清楚","lessons":[{"i":1,"t":"Course Introduction","ex":false,"n":"讲师 Laura Mueller 说明课程目标：把初学者带到熟练使用 Terraform。先讲基础设施即代码的价值与最佳实践，再学 HashiCorp 配置语言中的资源块、数据源、输入变量、本地变量与输出；高级部分覆盖工作区、对象验证、模块、状态操作与 Terraform Cloud，最后用 60 多个练习和 5 个完整项目做实战。"},{"i":2,"t":"How to Navigate the Course","ex":false,"n":"课程由三个 GitHub 仓库组成，主仓库 Terraform 课程按章节建文件夹，模块章节拆成三个以便分开练习；练习文件夹里列出全部可用练习，练习文件在每节课的资源区也能拿到；另两个仓库分别用于自建网络模块和测试 Terraform Cloud 的 VCS 集成，主仓库还含项目概述与预期成果列表。"}]},{"n":2,"dir":"2 - Tools and Setup","stage":"阶段 0 · 起步","zh":"工具与环境搭建","points":[{"t":"AWS 账号与 IAM 用户安全","d":"从零注册 AWS 账号并选定 eu-west-1 区域；给 root 用户绑定 MFA，再建一个同样带 MFA 的 IAM 管理员用户用于日常操作，避免一直使用 root 凭证。"},{"t":"Terraform CLI 安装与验证","d":"按官方文档在 macOS、Linux、Windows 上安装。macOS 用 Homebrew 前必须先添加 HashiCorp 的 tap，否则会装到过时的旧版本；装完用 terraform version 验证。"},{"t":"AWS CLI 安装与凭证认证","d":"安装 AWS CLI v2（官方 macOS 说明未列 Homebrew，但可用 brew 或 asdf 插件），再为管理员用户创建访问密钥并导出为环境变量，让 aws s3 ls 从报错变为成功。"},{"t":"VS Code 编辑器扩展","d":"最重要的是 HashiCorp Terraform 扩展，提供自动补全、语法校验与语法高亮；HashiCorp HCL 只面向 .hcl 文件、不含 Terraform 高亮，可选装。"}],"goal":"把 AWS 账号、Terraform 与 AWS CLI、VS Code 扩展在本机装好，并验证已能访问 AWS","lessons":[{"i":4,"t":"AWS Account Setup - Creating the Account","ex":false,"n":"完整演示从零注册：点创建 AWS 账户后填写 root 用户邮箱与账户名，中途放弃的账号会回到要求完成注册的页面。区域选欧洲（爱尔兰）eu-west-1，因为 AWS 资源按区域隔离，在别的区域看不到本课程创建的资源。"},{"i":5,"t":"AWS Account Setup - Adding MFA to the Root User","ex":false,"n":"账号建好后先做安全加固：在顶部搜索栏输入 IAM 进入身份与访问管理，按安全建议为 root 用户启用多因素认证（MFA）。完成后页面会重定向到安全凭证页，底部应能看到已绑定的 MFA 设备。"},{"i":6,"t":"AWS Account Setup - Creating a New Admin User","ex":false,"n":"解释为何要另建用户：日常操作用 IAM 管理员用户，权限略少且不带计费权限，root 凭证可以收起来。路径是 IAM 控制台的 Users，创建用户时保持选中 IAM 用户并授予对 AWS 服务和资源的完全访问，创建后同样为它绑定 MFA。"},{"i":7,"t":"Windows only users - Installing Windows Subsystem for Linux","ex":false,"n":"面向 Windows 用户：在 Microsoft Store 搜索 ubuntu，选择无版本号、22.04 或 24.04 发行版安装，快速得到与课程运行环境一致的 Ubuntu 虚拟机。Linux 与 Windows 互操作性很好，能在 Windows 上直接打开 Linux 里启动的程序，课程中要用的 Unix 命令都在这里练。"},{"i":8,"t":"Windows only users - Windows Subsystem for Linux Features","ex":false,"n":"演示 WSL 的文件系统互通：在任意终端运行 wsl，会在当前 Windows 用户目录下启动 Ubuntu，ls 能看到桌面、文档、下载等目录；把 echo 输出重定向成文件时，文件直接创建在 Windows 侧。安装依赖前记得查看 Linux 版的安装说明。"},{"i":9,"t":"Terraform Setup - Installing Terraform","ex":false,"n":"以官方文档为准说明 macOS、Linux 与 Windows 的安装步骤。坑点是 macOS 用 Homebrew 前要先添加 HashiCorp 的 tap，否则装到过时版本；加好 tap 后可用 asdf 或为 Devbox 指定版本，最后 terraform version 验证（本例 1.7.3，主版本号为 1 即可）。"},{"i":10,"t":"Terraform Setup - Installing the AWS CLI","ex":false,"n":"跟 AWS 官方文档安装，覆盖 Linux、macOS 与 Windows。macOS 段落里官方没提 Homebrew，但可以自行用 brew 或 asdf 插件安装，也可以直接用页面给出的命令安装指定版本；装好后用 aws --version 确认 CLI 已就绪。"},{"i":12,"t":"Terraform Setup - Authenticating into AWS","ex":false,"n":"先故意跑 aws s3 ls 验证默认没有凭证、会报找不到凭证的错；再到 IAM 的用户列表点 Udemy Admin 的安全凭证，创建访问密钥时选命令行界面（CLI）、命名为 Terraform course，把两个环境变量导出并在终端加载，再执行 aws s3 ls，看到成功输出即认证可用。"},{"i":13,"t":"IDE Setup - VS Code Useful Extensions","ex":false,"n":"推荐两个扩展：最有价值的是 HashiCorp Terraform，提供自动补全、语法校验与语法高亮；HashiCorp HCL 主要面向 .hcl 文件，不包含 Terraform 的语法高亮，功能更少，扩展页面本身也提示应安装 Terraform 扩展。"}]},{"n":3,"dir":"3 - Introduction to Infrastructure as Code (IaC) and Terraform","stage":"阶段 1 · 地基","zh":"IaC 与 Terraform 导论","points":[{"t":"IaC 是什么、解决什么痛点","d":"用代码而非控制台点击来预置和管理基础设施。命令式做法必须记住大量 CLI 命令、特性、执行顺序，面对 VPC、成百 EC2 这类庞大设施极易配置出错。"},{"t":"手工建资源 vs 代码建资源","d":"以创建 VPC 加公有/私有子网为例：控制台里每一步都要点，还要应付默认 VPC、命名易混等问题；换成 Terraform 则只是几段资源声明。"},{"t":"为什么选 Terraform","d":"对比 Pulumi、CloudFormation：平台无关可跨多个 provider、不与平台耦合、模块可组合复用，state 保存部署状态省去重复推演因而更快。"},{"t":"Terraform 架构：Core + Provider 插件","d":"核心负责组织与调度，provider 插件实现约定接口，封装与远程 API 交互的读取、创建、更新、删除逻辑；任何人都可按规范编写 provider。"},{"t":"Provision 阶段：plan/apply/destroy","d":"plan 用配置文件与 state 对比远程真实状态并输出变更计划，apply 接收并执行该计划，destroy 则彻底抹除 Terraform 管理的全部内容。"}],"goal":"理解 IaC 的价值、Terraform 的插件架构与 plan/apply/destroy 生命周期","lessons":[{"i":14,"t":"What Is Infrastructure as Code (IaC)","ex":false,"n":"回顾过去怎么建资源：在 AWS 或 GCP 控制台到处点击，或用 CLI 加脚本做部分自动化，但都得自己搞清怎么与远程基础设施交互。面对 VPC、大量 EC2、数据库、API 网关这类庞大设施，命令式做法要记住大量命令与执行顺序，配置极易出错；而 IaC 让你只声明想要的结果。"},{"i":15,"t":"Benefits of Infrastructure as Code","ex":false,"n":"梳理 IaC 的收益：更好的成本管理——一条命令即可创建或销毁整套环境，开发环境可按需拉起、当天销毁以省掉夜间费用；还有更高可靠性、更好的一致性与可扩展性、改进的部署流程、更少人为错误、更强安全策略与自文档化。自动化解放人力，模块可复用，运行日志保留可回溯。"},{"i":16,"t":"Creating Infrastructure Manually in AWS（任务预览）","ex":true,"n":"本练习的目标是在 AWS 中手动创建 VPC 和子网。讲师建议暂停视频、打开练习 01 文件按分步指南自己动手实现一遍，再回到下一讲观看解答视频；解答会完整演示控制台里的操作步骤，让你先亲身体验一遍命令式流程。"},{"i":17,"t":"Creating Infrastructure Manually in AWS","ex":true,"n":"在 AWS 控制台搜索 VPC，说明 VPC 是 AWS 基础设施的逻辑分区、资源与其他租户隔离；注意每个区域都自带默认 VPC，切换到北弗吉尼亚会看到另一个默认 VPC。随后创建仅 VPC 命名为 demo VPC，AWS 会自动附带一张主路由表，再在其下创建 public subnet 与 private subnet。"},{"i":18,"t":"Creating Infrastructure with Terraform（任务预览）","ex":true,"n":"本练习改用 Terraform 与 IaC，创建与上一节完全相同的 VPC 和两个子网（其中一个是公有子网）。讲师提供练习 02 文件供你暂停后自行实现，并特别指出其中附带的 AWS Terraform provider 文档资源，足以部署出预期结果里的所有资源。"},{"i":19,"t":"Creating Infrastructure with Terraform","ex":true,"n":"快速预览 Terraform 配置语言：新建 01-benefits 文件夹与 vpc.tf（.tf 扩展名，HCL 语法），先写 terraform 块与 required_providers，声明 AWS provider 的 source 为 hashicorp/aws、版本 5.x；再用 aws_vpc 声明 VPC，写 aws_subnet 并通过 vpc_id 引用 aws_vpc.demo_vpc 关联子网。本节先不 apply。"},{"i":20,"t":"Why Use Terraform","ex":false,"n":"对比 Pulumi、AWS CloudFormation 等其他 IaC 工具，讲 Terraform 的优势：平台无关，同一项目里可同时写 AWS、GCP、Azure 等多个 provider 的配置；不与任何平台紧密耦合；模块化，可把资源分组做成模块再组合拼装。结尾提到 state 保存部署状态，省去重新推演，因此运行更快。"},{"i":21,"t":"Terraform's Architecture","ex":false,"n":"讲解插件架构：核心通过 provider 扩展，provider 是一段实现了约定接口的代码，封装与远程 API 交互的读取、创建、更新、删除逻辑，AWS、Google Cloud 各有自己的 provider。核心不必自行对接所有远程 API，任何人也能按规范编写并发布 provider；对资源配置或 provider 用法有疑问就要查文档。"},{"i":22,"t":"Stages of Provisioning Infrastructure","ex":false,"n":"梳理预置基础设施的三个阶段：plan 阶段以配置文件和已存在的 state 为输入，通过 provider 调用远程 API 获取真实世界对象的当前状态，与 state 和配置比较，有差异就输出变更计划；apply 阶段接收并执行这个计划；destroy 阶段则把 Terraform 管理的全部内容彻底抹除。"},{"i":23,"t":"Exploring Terraform Stages（任务预览）","ex":true,"n":"本练习的目标是理解 Terraform 的不同阶段。分步指南里有不少命令，讲师建议暂停视频把所有命令都跑一遍，并观察它们各自的控制台输出，打开练习 03 文件完成后再观看解答录屏，其中会围绕各个阶段做更深入的讨论。"},{"i":24,"t":"Exploring Terraform Stages","ex":true,"n":"直接跑 terraform plan 会报错，提示锁文件尚未选定版本、需执行 terraform init；init 会下载 required_providers 里指定的 provider 到 .terraform 目录，并生成 terraform.lock.hcl 锁定版本，之后新增 provider 都要再跑 init 更新。接着 plan 显示将创建一个 VPC 和一个公有子网（列出顺序不代表创建顺序），apply 后到控制台查看，最后一条命令销毁全部资源。"}]},{"n":4,"dir":"4 - Terraform's Building Blocks","stage":"阶段 1 · 地基","zh":"Terraform 积木块","points":[{"t":"HCL 语法：block/attribute/expression","d":"新建 hcl.tf，认识 terraform 块与 resource 块的区别；resource 块由「类型标签 + 属性标签 + 表达式」三部分组成，标签与资源类型的组合必须全局唯一。"},{"t":"terraform 块与 required_providers","d":"terraform 块只允许常量，不能引用输入变量；用它声明 required_version、required_providers，以及 backend、cloud 等项目级设置，并学会用 =、>= 等运算符约束版本范围。"},{"t":"核心 CLI 命令实操","d":"在真实项目里跑通 terraform init / plan / apply / fmt / validate。Terraform 不需要 import，只扫描当前目录不进入子目录；新增 provider 后必须重新 init。"},{"t":"Terraform State 的作用","d":"state 是配置文件与真实资源之间的映射，含敏感值、outputs 与依赖关系元数据；缺了它 Terraform 无法工作，也会因此出现配置漂移问题，存储位置必须严加控制。"},{"t":"本地与远端 state 检查","d":"未定义 backend 时 state 默认落在本地 terraform.tfstate，apply 后才生成并附带备份文件；用 show 查看内容、确认资源、provider 归属与 outputs 都记录其中。"},{"t":"Backend：S3 与 partial backend","d":"backend 决定 state 存在哪，分为本地、Terraform Cloud、第三方远程三类；S3 需自建桶并用 -migrate-state 迁移，还可用 .tfbackend 文件加 -backend-config 实现按环境注入。"},{"t":"Provider 的安装、版本与命名","d":"provider 是 Terraform 与远程 API 的桥梁，独立开发并遵循插件架构；通过 required_providers 声明 source 与版本，本地名称可改但会导致重复 provider 报错。"}],"goal":"手写一份可 apply 的 HCL 配置，并把 state 托管到 S3 远端后端","lessons":[{"i":25,"t":"The HashiCorp Configuration Language (HCL)（任务预览）","ex":true,"n":"本练习目标是对 HCL 有整体了解：它是编写 Terraform 配置的语言，你要逐一写出其中最常见的几种块。注意这里只练语法，不要求这些块组合起来能真正通过 terraform plan 或 terraform apply。练习文件附有语法文档链接与分步指南，可暂停视频打开 exercise 04 先自己实现。"},{"i":26,"t":"Introduction to HashiCorp Configuration Language (HCL)","ex":false,"n":"新建 02-hcl 文件夹和 hcl.tf（文件名不重要，main.tf、components.tf 都行）。先看 terraform 块：在 required_providers 里写 source = hashicorp/aws 并把版本固定为 5.37.0。再看 resource 块，两个标签分别是资源类型（如 aws_vpc、aws_s3_bucket，类型+标签组合必须唯一）和资源名称，最后是会被求值的表达式。"},{"i":27,"t":"Terraform Configuration","ex":false,"n":"深入 terraform 块：只允许使用常量，不能在里面引用输入变量；它可接收 backend、cloud（Terraform Cloud）与版本信息。注意 required_version 约束的是 Terraform 自身版本（示例精确要求 1.7.0），required_providers 约束的是各 provider 的可接受版本，可配合 =、>= 等运算符写成 1.5.x 或任意 1.x。"},{"i":28,"t":"Our First Terraform Project（任务预览）","ex":true,"n":"本练习要交付第一个完整可用的 Terraform 项目，页面上列出了需要部署的资源清单。前面练习中学过的命令和 AWS provider 都会用到，属于综合串联练习。可暂停视频打开 exercise 05 文件自行实现，再回来观看解答视频中的深入讲解。"},{"i":29,"t":"Our First Terraform Project - Creating Resources","ex":true,"n":"新建 03-first-terraform-project 文件夹与 providers.tf（按惯例也可叫 provider.tf，terraform 配置块必须放在这里）。写入 required_version、required_providers 并声明两个 provider：hashicorp/aws 与 random（random 可生成随机字符串或随机 ID，随机 ID 正好用在桶名里）。最后在 provider 块里指定 region，示例用 eu-west-1，换成你自己的区域。"},{"i":30,"t":"Terraform CLI（任务预览）","ex":true,"n":"本练习进一步深入 Terraform CLI：页面上列出多条到目前为止还没探索过的命令，需要你在项目中逐条实际执行一遍。建议暂停视频，打开 exercise 06 文件，先自己把这些命令跑过一遍，再回来看演示视频中的用法与输出解读。"},{"i":31,"t":"Terraform CLI - Exploring the Most Common Commands","ex":true,"n":"先把散落在 providers.tf 里的 S3 资源重构到独立的 s3.tf；Terraform 不需要 import，也只看当前目录、不进入子目录，所以不能把文件丢进子目录。运行 terraform init 安装 aws 与 random provider（新增 provider 必须重跑），凭证从环境变量读取；再用 terraform fmt 格式化，plan/apply 产出的计划文件（如 myplan）用完即删，别提交进仓库。"},{"i":32,"t":"Terraform State","ex":false,"n":"state 的本质是把配置文件中的资源映射到真实世界的对象上，保存资源配置以及它们与已创建基础设施之间的绑定关系。除主目标外它还包含对 Terraform 有用的元数据、后端配置、项目输出和敏感值。因为含敏感信息，state 是 Terraform 的必备元素、没有它无法工作；它也记录资源依赖关系，决定创建、更新、删除的顺序。"},{"i":33,"t":"Inspecting the State of Our Project","ex":false,"n":"进项目目录跑 terraform init，会看到本地出现 .terraform 目录和两个 provider。由于没有定义 backend 块、也没用 Terraform Cloud，state 默认落在本地。先 plan（临时文件会消失），apply 后才生成永久的 terraform.tfstate，打开可看到 outputs 的值、资源列表以及每个资源所属的 provider。旁边还有备份文件，实际工作中更常用的是在 S3 上开版本控制来前滚或回滚。"},{"i":34,"t":"Backends in Terraform","ex":false,"n":"backend 基本上决定了 Terraform 把 state 文件存到哪里，而 state 是管理项目的事实来源，所以要放在能控制访问权限、又不会凭空消失的地方。backend 分三类：本地 backend（state 存在本机）、Terraform Cloud（不只是存储 state，还提供额外能力）、第三方远程 backend（如 S3、Google Cloud Storage、Azure Blob Storage）。"},{"i":35,"t":"Setting Up a Remote S3 Backend（任务预览）","ex":true,"n":"本练习目标是改用远程 S3 backend 来存放 Terraform 的 state 文件，页面给出期望达成的结果清单和这个练习需要部署的资源。建议先暂停视频，打开 exercise 07 文件动手实现，其中包括把项目复制成新目录、手动准备 S3 存储桶以及迁移已有 state，再回来看解答视频。"},{"i":36,"t":"Setting Up a Remote S3 Backend","ex":true,"n":"把 03 目录复制成 04-backends，删掉本地 state、state 备份文件和 .terraform 目录后重新 init。接着加 backend \"s3\" {}（可选后端还有 azurerm、consul、http 等，自己实现可行但工作量大）。Terraform 不会替你建桶，要先手动创建 terraform-course-laura-mueller-remote-backend 并开启版本控制，再填入 bucket、key、region 等参数，init 时按提示加 -migrate-state 迁移旧 state。"},{"i":38,"t":"- Partial Backend Configuration（任务预览）","ex":true,"n":"本练习主题是 partial backend configuration（部分后端配置）：目标是为开发环境和生产环境各准备一份配置，backend 块里只写最少的信息，其余从外部文件传入。页面列出了期望达成的结果，可先暂停视频打开 exercise 08 文件自行尝试，再回来看解答。"},{"i":39,"t":"- Partial Backend Configuration","ex":true,"n":"把 backend 块内容整块剪切到 dev.s3.tfbackend，命名惯例是「任意前缀 + 点 + 后端名」（用 local 就是 local.tfbackend），文件里例中 key 写 04-backend/dev/state.tfstate。执行 terraform init -backend-config=dev.s3.tfbackend，提示后端配置有变化时照旧加 -migrate-state；再 plan -out=dev.plan 并 apply 该计划文件，最后 destroy 时加 -auto-approve 跳过确认并检查 state 已清空。"},{"i":40,"t":"Terraform Providers","ex":false,"n":"provider 是 Terraform 与远程 API、平台交互的唯一途径——Terraform 核心自身无法管理 AWS、Google Cloud、Azure 上的资源。每个 provider 带来一组资源类型和 data source，独立于 Terraform 开发维护，契合插件架构，任何人都可以为有远程 API 的东西写 provider。项目必须在 terraform 块的 required_providers 里声明所需 provider，并可生成 dependency lock 文件提交到仓库以锁定版本。"},{"i":41,"t":"- Working with Providers（任务预览）","ex":true,"n":"本练习要在 Terraform 中实际配置 provider：把默认的 AWS provider 配成 eu-west-1（或你之前一直用的区域），再配置第二个 AWS provider 实例并把区域设为 us-east-1，以此在同一个项目里同时使用两个不同区域的 provider。可暂停视频打开 exercise 09 文件先自行完成，再回看解答录屏。"},{"i":42,"t":"- Working with Providers","ex":true,"n":"新建 05-providers/providers.tf，required_version 固定首位 1（接受任意 1.x），required_providers 里 aws 的 source 是 hashicorp/aws，版本写 >= 5.0 且 < 6.0。演示把 provider 本地名改成 whatever 会怎样：技术上都允许，但 plan 会报「重复的 required provider，资源是隐式引入的」，解决办法是让本地名与资源一致或在资源块里显式指定。init/plan/apply 走一遍后，把测试资源 destroy 掉。"}]},{"n":5,"dir":"5 - Resources","stage":"阶段 2 · 核心","zh":"资源与依赖","points":[{"t":"resource 块语法","d":"Terraform 配置的主体构建块，用资源类型、本地名称和属性参数管理 EC2、S3 桶等对象；参数随 provider 变化并会被校验，敏感属性不可随意输出。"},{"t":"资源依赖与创建顺序","d":"属性引用即隐式依赖：IAM 角色提到某个 S3 桶或引用 VPC 信息就会串起来；互不相关的资源并行创建，必要时用 replace_triggered_by 显式处理替换。"},{"t":"meta-arguments 元参数","d":"depends_on 定顺序，count/for_each 批量创建同类资源，provider 指定用哪个 provider，lifecycle 的 create_before_destroy 先建后拆，另有 precondition/postcondition 校验对象。"},{"t":"VPC+EC2 全流程实战","d":"建 VPC、公有子网、互联网网关、路由表与关联，再自定义安全组、启动 EC2 并换成免费 nginx AMI，最后整体销毁，全程只靠命令行完成。"},{"t":"公共标签抽取（locals）","d":"同样的 tags 要在 VPC、子网、互联网网关、路由表四处重复；locals 像函数体内的临时变量，集中定义后用 merge 函数与资源自身标签合并。"},{"t":"销毁与资源清理","d":"先用 terraform state list 盘点项目管理的全部资源，再执行 terraform destroy；destroy 只是带 destroy 标志的 apply，会先刷新状态再逐个回收。"}],"goal":"能从零搭出 VPC + EC2 全套基础设施，并讲清资源依赖与创建顺序","lessons":[{"i":43,"t":"Introduction to Resources","ex":false,"n":"resource 是 Terraform 配置的主要构建块，可管理 EC2、S3 存储桶、random ID 等成百上千种基础设施对象。块内写资源类型、本地名称与属性参数，参数随 provider 和资源类型变化，Terraform 会校验有效性；私钥、自签发 TLS 证书等属性属敏感值。创建同一资源的多个实例可用循环，课程后面专门讲。"},{"i":44,"t":"Resource Dependencies","ex":false,"n":"Terraform 很擅长识别资源依赖并并行或顺序创建，但并不完美，必要时仍要显式管理。apply 时先建互不相关的资源（VPC 与 S3 桶并行）；若 IAM 角色引用了 VPC 信息或提到某个 S3 桶，就形成依赖；EC2 与 RDS 同在这个 VPC、都引用子网 ID，因此都依赖 VPC。EC2 每次变更都想换角色时可用 replace_triggered_by。"},{"i":45,"t":"Meta-Arguments","ex":false,"n":"元参数用于配置 Terraform 的行为，对 resource 和 data source 都适用。depends_on 显式定义按顺序处理；count / for_each 创建多个同类型资源，配置不必完全相同；provider 指定该资源用哪个 provider；lifecycle 里的 create_before_destroy 让 Terraform 先建新再拆旧（用于无法就地更新的替换）；另有 precondition / postcondition 做对象校验。"},{"i":46,"t":"VPC and EC2 Project - Project Overview","ex":false,"n":"第一个项目的目标是在 AWS 部署一台 NGINX 服务器。步骤拆解：创建 VPC，在其中建公有子网（练习目的也可建私有子网）；建安全组放行 80 的 HTTP 与 443 的 HTTPS；子网要成为公有子网必须关联路由表，而路由表要有指向互联网网关的路由；最后部署使用 NGINX 镜像的 EC2 并挂上该安全组，用公网 IP 验证可以访问。"},{"i":47,"t":"VPC and EC2 Project - Launching the VPC and Subnet","ex":false,"n":"先建 06-resources 目录并写 README.md 记录实现步骤，再用 README 列出六步计划。provider.tf 里写 required_version、required_providers 和 provider 配置；因为是新终端要先 source .env 加载 AWS 凭证，再 terraform fmt、init、version。随后定义 aws_vpc 与 aws_subnet（规划 CIDR 与可用区），plan/apply 后可在控制台按 project = 06-resources 过滤出本项目的子网。"},{"i":48,"t":"VPC and EC2 Project - Provisioning the Internet Gateway","ex":false,"n":"先讲成本提醒：2024 年起 AWS 对公网 IPv4 收费，免费套餐每月有 750 小时额度。随后建 aws_internet_gateway 并传入 aws_vpc.main.id 关联 VPC，再建 aws_route_table（含指向互联网网关的路由），最后用 aws_route_table_association 把它关联到子网。apply 时注意 diff 中 tags 的新旧差异，确认 Name 标签已写进路由表。"},{"i":49,"t":"VPC and EC2 Project - Extracting Common Tags","ex":false,"n":"路由表、互联网网关、子网、VPC 四处都要写同样的 tags，这是很糟糕的重复模式，于是引出 locals：可类比函数体内声明的临时变量，它不是输入变量，也无法从项目外部设置。语法上引用写 local.xxx，声明块写 locals；再用 merge 函数把通用标签与各资源自身的 tags 合并，避免到处重复改。"},{"i":50,"t":"VPC and EC2 Project - Launching the EC2 Instance","ex":false,"n":"回顾已完成 VPC、子网、互联网网关（含传入 VPC ID 的关联）、带 IGW 路由的路由表与路由表关联，并用 merge 复用通用标签。本节新建 compute.tf 写 aws_instance：把 AMI 换成 Bitnami 提供的免费公开 nginx 镜像（AMI 本身免费，只付 EC2 实例费用），便于验证实例是否正常。同时把「销毁所有资源」加入步骤清单，避免云上闲置资源占用额度。"},{"i":51,"t":"VPC and EC2 Project - Understanding Security Groups","ex":false,"n":"取消注释 EC2 资源直接 apply，观察未指定安全组时 AWS 会自动分配 VPC 默认安全组：控制台实例先 pending，约 30 秒后变 running，Terraform 随即判定完成。讲解默认安全组模型——允许同一 VPC 内实例之间的私有流量（如两个 EC2 互访、EC2 访问 VPC 内的 RDS），但不允许公共入站；也可以为 RDS 建类似规则，或按流量来源放行与 EC2 关联的安全组。"},{"i":52,"t":"VPC and EC2 Project - Creating a Custom Security Group","ex":false,"n":"指出默认规则只放行来自同一安全组的流量，并非公共入站。新建资源 aws_security_group.public_http_traffic，传入 aws_vpc.main.id，用 ingress 块放行 80（HTTP）与 443（HTTPS）。关联方式是在 EC2 实例的 vpc_security_group_ids 里引用该安全组 ID——控制台手动建机就是在 VPC 安全组处挑选。应用后先把 EC2 注释掉再 apply 销毁，避免占用免费套餐小时数。"},{"i":53,"t":"VPC and EC2 Project - Deploying an NGINX EC2 Instance","ex":false,"n":"在控制台 Images 的 AMI Catalog 里搜 nginx，用 Pricing model 的 Free 过滤掉 500 多个结果，选中 Bitnami 的免费 nginx 镜像（软件 0 费用，EC2 用 t2.micro，免费额度外约 0.013 美元/小时），复制 AMI ID 填进 compute.tf。plan 显示销毁一个并新增一个资源：AWS API 不支持 AMI 就地更改，所以 aws_instance.web 必须被替换，替换成功后用公网 IP 访问验证 NGINX 是否正常。"},{"i":54,"t":"VPC and EC2 Project - Wrap-Up and Destroying Resources","ex":false,"n":"先用 terraform state list 盘点 Terraform 到底管理了什么：EC2 实例、互联网网关、路由表、路由表关联、安全组（还有两条入站规则）、子网和 VPC——手动创建与删除会非常繁琐。执行 terraform destroy，它只是带 destroy 标志的 apply 别名，每次都会先刷新状态、尝试把真实资源拉回配置声明的状态，再逐个销毁；确认后在 README 里标记完成。"}]},{"n":6,"dir":"6 - Project - S3 Static Website","stage":"阶段 2 · 核心","zh":"项目：S3 静态网站","points":[{"t":"S3 存储桶与版本约束","d":"新建 proj01-s3-static-website 目录，provider.tf 中写 required_version >= 1.7.0 且 < 2.0.0 并指定 AWS 区域；桶名全局唯一，所以在 provider 里拼上一段随机后缀，再 terraform fmt 后 apply。"},{"t":"关闭公共访问阻止","d":"新增 aws_s3_bucket_public_access_block 资源，把 block_public_acls、block_public_policy、ignore_public_acls、restrict_public_buckets 全设为 false，并配合桶策略允许任何人读取对象。"},{"t":"静态网站托管配置","d":"只开公共访问还不算网站，需 aws_s3_bucket_website_configuration 指定索引文档与错误文档并打好描述性标签；站点端点必须用 output 暴露，不能中途进控制台查看。"},{"t":"用 aws_s3_object 托管文件","d":"先永久删除控制台手动上传的文件，改用 aws_s3_object 声明式上传并指定 bucket 与 key；注意标识符是资源类型加标签的组合，destroy 时对象先删、桶最后删。"}],"goal":"用 Terraform 完整交付 S3 静态站点：建桶、放开公共访问、配网站配置并托管 HTML","lessons":[{"i":55,"t":"Project Overview","ex":false,"n":"列出预期成果：部署 S3 存储桶托管静态文件，准备 index 与 error.html；初期可先在控制台手动上传，第 08 步再改成用 aws_s3_object 上传；还要禁用公共访问阻止、配置允许任何人获取对象的策略、创建静态网站配置，并通过 Terraform 输出站点端点。"},{"i":56,"t":"Deploying an S3 Bucket","ex":false,"n":"新建 proj01-s3-static-website 目录与 provider.tf，写 required_version 为 >= 1.7.0、< 2.0.0 并配置 AWS provider 的区域；桶名必须唯一，所以在 provider 中拼出随机后缀，再建 s3.tf 声明 aws_s3_bucket，terraform fmt 后 apply，控制台即可看到空桶。"},{"i":57,"t":"Disabling Public Access Block","ex":false,"n":"要让用户读到 HTML，先加 aws_s3_bucket_public_access_block，把 block_public_acls、block_public_policy、ignore_public_acls、restrict_public_buckets 全设为 false，并绑定 aws_s3_bucket.static_website.id；字段名来自 AWS 文档，视频演示了如何到 Terraform Registry 查资源参数。"},{"i":58,"t":"Configuring the S3 Static Website","ex":false,"n":"存储桶加公共访问还不算静态网站，需要 aws_s3_bucket_website_configuration 并指向 aws_s3_bucket.static_website.id，配置索引文档与错误文档；建议按项目命名标签，描述里可写 Terraform、S3、AWS 等关键词。站点地址要用 output 暴露，不能进控制台看完再传给 CI/CD。"},{"i":59,"t":"Uploading Files to S3 via Terraform","ex":false,"n":"先在控制台永久删除手动上传的 index.html 与 error.html，再写两个 aws_s3_object 资源，指定 aws_s3_bucket.static_website.id 与 key 完成上传；apply 会提示标识符重复，因为标识符是资源类型加标签的组合，改名即可。destroy 时文件先删、桶最后删。"}]},{"n":7,"dir":"7 - Data Sources","stage":"阶段 3 · 进阶","zh":"数据源 Data Sources","points":[{"t":"data 块：读而非建","d":"数据源用于查询远程 provider API 或其他 Terraform 项目里的已有资源，比如别人管理的 VPC 和角色；Terraform 按过滤条件找到它们并返回对象供引用，而不会把它们纳入本项目的 state 管理。"},{"t":"拉取 AMI 数据","d":"用 data aws_ami 解决硬编码 AMI ID 的问题，按过滤条件筛出最新的 Ubuntu AMI 再交给 aws_instance 的 ami；写法与 resource 类似，只是开头是 data，标签组合必须唯一才能被引用。"},{"t":"获取账户 ID 与区域","d":"data aws_caller_identity 来自 STS 部分，可拿到 account_id，用在 IAM 策略或资源 ARN 上；data aws_region 提供当前区域信息，写资源描述或 EC2 端点时很有用。"},{"t":"拉取 VPC 信息","d":"对控制台手动创建（模拟别的团队管理）的 VPC，用 data aws_vpc 配 tags 过滤条件查回信息并 output vpc_id，替代硬编码 ID；但最终仍要自己确认查到的确实是正确那个 VPC。"},{"t":"data.aws_availability_zones","d":"获取 AWS 自身底层设施信息而非自己项目的信息：用 state = available 过滤出可用区（不写会列出所有可能状态），拿到 1a/1b/1c 这类字符串后即可在代码里引用指定可用区。"},{"t":"用 data 定义 IAM 策略文档","d":"data aws_iam_policy_document 用 HCL 写 statement 块（effect / actions / resources）来生成策略 JSON，替代 jsonencode 手拼字符串；多个 statement 就写多个块组成数组，resource 可引用 S3 桶的 arn。"}],"goal":"能把 AWS 上已有但不由自己管理的资源接进配置作为输入","lessons":[{"i":60,"t":"Introduction to Data Sources","ex":false,"n":"数据源用于查询来自远程 API 或其他 Terraform 项目的数据。典型场景：外部团队已部署好 VPC 和角色，你想在自己的项目里用它们——既不能重新创建（已经存在），也不想开始纳管它们。这时写 data 块，Terraform 调用 provider 的远程 API 按过滤条件找到该 VPC，把结果作为对象供 EC2、RDS 等资源引用，而它们仍不属于本项目的 state。"},{"i":61,"t":"Fetching AMI Data（任务预览）","ex":true,"n":"练习目标是开始使用数据源，第一个用例是获取 AMI 信息：用数据源在 Terraform 中拿到最新的 Ubuntu AMI，并据此部署一台 AWS EC2 实例。视频给出 AWS AMI 数据源的官方文档入口作为参考，可暂停录制打开 exercise ten 文件自己先做，完成后再回来看解答视频的详细讲解。"},{"i":62,"t":"Fetching AMI Data","ex":true,"n":"新建 07_data_sources 目录，从资源章节复制 provider.tf（先只保留 AWS provider 并配好区域），source .env 加载凭证后 terraform init——认证报错时记得重新 source。compute.tf 里先部署一个简单 EC2 实例，不给 VPC 安全组 ID 时它会落在该区域默认 VPC 自带的默认子网；再用 data 块按过滤条件查出最新 Ubuntu AMI 替换硬编码 ID。"},{"i":63,"t":"Fetching AWS Account Information and Region（任务预览）","ex":true,"n":"继续数据源的第二个用例：获取 AWS 调用者身份（caller identity）以及 AWS 区域，这两个都可以直接作为数据源使用。可以先自己试，前去 exercise 11 文件，必要时借助 Google 搜索；练习文件里列出了预期成果，做完再回来看解答视频中对解法的详细讨论。"},{"i":64,"t":"Fetching AWS Account Information and Region","ex":true,"n":"在 Terraform Registry 里搜索 HashiCorp AWS provider 文档，定位到 STS 部分的 aws_caller_identity，可拿到用户 ID 等信息，用在 IAM 策略或账户内资源 ARN 上；再写 data aws_region 获取当前区域的描述与 EC2 端点。两者都命名为 current 并用 output 打印，最后移除多余参数与 provider，写 terraform fmt 收尾。"},{"i":65,"t":"Fetching VPC Data（任务预览）","ex":true,"n":"本练习用数据源获取 VPC 信息：先在 AWS 控制台手动创建一个 VPC，然后应该能根据自己定义的 environment 标签过滤查出这个 VPC 的信息；另外还要定义一个 output 显示查到的 VPC ID。可先暂停视频前往 exercise 12 文件自己尝试，再回来看解答视频。"},{"i":66,"t":"Fetching VPC Data","ex":true,"n":"先在控制台创建名为 console managed 的 VPC 并填写 IPv4 网段，模拟由控制台（其他团队）管理的网络，可以只用创建 VPC 以减少要销毁的东西。虽然可以复制 VPC ID 硬编码，但 Terraform 给了更好的方式：用 data 块加 tags 过滤条件查回该 VPC 并 output vpc_id；同时强调归根结底是自己的责任，确认查到的确实是正确那个 VPC。"},{"i":67,"t":"Fetching AWS Availability Zones","ex":false,"n":"介绍属于 AWS 底层设施而非自己项目的信息型数据源：data aws_availability_zones。控制台建子网时会看到 eu-west-1 下的 1a、1b、1c，这些字符串可以直接写进 Terraform 指定可用区。数据源可按 state 过滤（列表底部列出了所有可能状态），传入 available 只拿可用区；再用 output azs 打印 data.aws_availability_zones.available 的内容，检查数据源返回了什么。"},{"i":68,"t":"Creating AWS IAM Policies（任务预览）","ex":true,"n":"另一个非常常见的数据源用例是创建 AWS IAM 策略。若想先自己尝试，可暂停视频：需要创建一个 AWS IAM 策略文档数据源，建议再次前往 Terraform 中 AWS provider 文档并做 Google 搜索，弄清如何构建它。exercise 13 文件里有更详细的分步指南，语法没思路时可以参考，并给出了预期结果。"},{"i":69,"t":"Creating AWS IAM Policies","ex":true,"n":"早先项目 01 用 jsonencode 把 HCL 拼成 JSON 手写 S3 桶策略，这次改用 data aws_iam_policy_document（命名 static_website）：写 statement 块，actions 用 s3:GetObject，resource 引用 aws_s3_bucket.public_read_bucket.arn，表示桶内对象可被任意类型主体下载；需要多个 statement 就写多个块，它们组成 statements 数组。最后 terraform format 并 output iam_policy 查看结果。"}]},{"n":8,"dir":"8 - Input Variables, Locals and Outputs","stage":"阶段 3 · 进阶","zh":"输入变量、Locals 与输出","points":[{"t":"variable 声明与类型校验","d":"在 variables.tf 中用 variable 块声明，配置 type、default、description，引用写 var.名称；用 validation 条件块配合 contains、startswith 等函数校验取值。"},{"t":"Map 与 Object 变量","d":"object({...}) 用键值对声明固定结构，适合组合式配置；map 允许任意键但强制值类型，适合 additional_tags 这类无法预知键名的场景。"},{"t":".tfvars 与变量优先级","d":"terraform.tfvars 默认自动加载，*.auto.tfvars 优先级更高并覆盖前者；不含 .auto.tfvars 的 override 文件需 -var-file 显式传入，TF_VAR_ 环境变量优先级最低。"},{"t":"local 表达式","d":"用 locals 块定义配置内部的中间值，可以引用变量和其他 locals，但不能从外部赋值；适合跨资源复用标签、名称等公共属性。"},{"t":"output 与敏感值","d":"在 outputs.tf 用 output 块暴露结果，terraform output 可查询、-json 会附带额外属性；sensitive = true 只遮蔽显示，state 中仍是明文。"},{"t":"代码整理与拆分","d":"把变量、资源、输出分别放进 variables.tf、compute.tf、outputs.tf 管理，并清理会意外部署产生费用的 tfvars 与 auto.tfvars 覆盖项。"}],"goal":"掌握 variable、locals、output，用类型、校验与 tfvars 写出可复用可传参的配置","lessons":[{"i":70,"t":"Input Variables","ex":false,"n":"说明引入输入变量的动机：此前值都硬编码在资源或 locals 里，现在可在 variables.tf 声明 variable、用 var.名称 引用，并配置 type、default、description；敏感变量加 sensitive 后控制台不再输出，但 state 中仍是明文，apply/plan 时以 CLI 传入值为准。"},{"i":71,"t":"Declaring and Using Input Variables（任务预览）","ex":true,"n":"练习目标是用变量把 AWS 区域参数化，并提醒这是 Terraform 中比较棘手的问题、存在一些陷阱；给出预期结果，可暂停前往 exercise 14 文件自行尝试，再回来观看解决方案讲解。"},{"i":72,"t":"Declaring and Using Input Variables","ex":true,"n":"新建 08-input-vars-locals-outputs 目录与 provider.tf（required_version 1.7.0、HashiCorp/aws >=5.0 <6.0），terraform init 后在 compute.tf 用 data.aws_ami.ubuntu.id 建 t2.micro 实例；直接 plan 会因缺 region 报错，故尝试用变量传区域，末尾又移除变量硬编码 eu-west-1。"},{"i":73,"t":"Typing and Validating Input Variables（任务预览）","ex":true,"n":"本练习目标是使用变量来自定义 EC2 实例的大小以及实例上的数据卷配置，并给出预期的部署结果；想自己尝试可暂停视频前往 exercise 15 文件，再回来观看解决方案讲解。"},{"i":74,"t":"Typing and Validating Input Variables","ex":true,"n":"在 variables 中声明 ec2_instance_size、ec2_volume_type（string）与 ec2_volume_size（number），到 compute.tf 里引用，控制实例类型和根块卷大小与类型；运行 terraform format、plan、apply 验证，并说明实例类型变更只影响受管实例、卷参数才是频繁变动项。"},{"i":75,"t":"Map and Object Variables（任务预览）","ex":true,"n":"本练习引入变量的更复杂类型：用 object 一次性设置 EC2 实例的卷配置，替代之前分散的多个变量，并给出预期结果；可暂停视频前往 exercise 16 文件自行尝试，再回来观看解决方案。"},{"i":76,"t":"Map and Object Variables","ex":true,"n":"用 object({...}) 把卷的 size 与 type 合并成一个复杂类型变量替换原先两个变量；再用 map 类型变量 additional_tags 接收任意键、强制值为 string 的标签（object 必须给全结构，标签键无法预知）；命令行传 object 很麻烦，引出用 tfvars 文件传值，最后 terraform fmt。"},{"i":77,"t":"Working with .tfvars Files（任务预览）","ex":true,"n":"本练习聚焦用 .tfvars 文件传值：要求创建 terraform.tfvars，再把它重命名为 dev.terraform.tfvars、并新建 prod.terraform.tfvars，观察 Terraform 如何管理这些文件；可暂停前往 exercise 17 文件自行尝试后回来观看详细讲解。"},{"i":78,"t":"Working with .tfvars Files","ex":true,"n":"解释 additional_tags 为什么用 map 而非 object（object 需声明完整结构，标签键无法预知），并新建必须精确命名的 terraform.tfvars 存值而非写进 state；terraform fmt 也会格式化 tfvars；plan 里卷类型显示 gp2 而非 variables 默认的 gp3，证明文件被自动加载。"},{"i":79,"t":"Working with .auto.tfvars Files（任务预览）","ex":true,"n":"本练习转向 auto.tfvars 文件，重点观察它的自动加载行为；视频给出逐步操作指南，可随时暂停按步骤动手，完成后回到下一节观看解决方案的演示录像。"},{"i":80,"t":"Working with .auto.tfvars Files","ex":true,"n":"先重命名或删除多余的 prod tfvars 文件做演示，再新建 prod-override.auto.tfvars：Terraform 会自动查找所有以 .auto.tfvars 结尾的文件，直接 plan 就能看到 auto.tfvars 优先级高于 terraform.tfvars 并覆盖其中取值；示例中保留 t2.micro，只覆盖 additional_tags。"},{"i":81,"t":"Variable Precedence Order","ex":false,"n":"演示变量优先级：先提醒不要 apply（会尝试多种实例类型、可能产生费用），只跑 plan；把实例类型校验的 contains 改成 startswith（注意参数顺序：变量在前、前缀在后）以接受任意 T3 系列；再导出 TF_VAR 环境变量作为最低优先级来源，观察实例类型来自环境变量、卷配置来自 terraform.tfvars、标签来自 auto.tfvars，最后撤销校验改动。"},{"i":82,"t":"Code Cleanup","ex":false,"n":"清理演示遗留：从 prod.auto.tfvars 中删掉 t3.large，避免 apply 时意外部署产生费用；因为 .auto.tfvars 会被自动加载，也可以整个删除，或改名成 override.tfvars 这类不含 .auto.tfvars 的文件、必须用命令行显式传入；terraform.tfvars 保持默认自动加载，并确认规格仍在免费额度内。"},{"i":83,"t":"Working with Locals（任务预览）","ex":true,"n":"本练习目标是使用局部值改进项目：创建若干 locals，用新建的 common_tags 配合已有 additional_tags 重构 EC2 实例，并部署一个新的 S3 资源复用 locals 中的值；可暂停打开 exercise 19 文件自行尝试。"},{"i":84,"t":"Working with Locals","ex":true,"n":"解释 locals 可以在内部引用变量但无法从外部赋值，像函数体内的临时中间值：用 locals 块定义 project_owner、cost_center、managed_by，引用时写 local.managed_by；再建一个 locals 块引用另一个块里定义的值（Terraform 完全合法），terraform fmt 与 plan 验证，最后销毁三个资源。"},{"i":85,"t":"Working with Outputs（任务预览）","ex":true,"n":"本练习更深入地讨论如何在 Terraform 中使用输出值，先给出逐步指南；可暂停视频前往 exercise 20 文件自己动手，再回来观看解决方案以获得对输出值更深入的讲解。"},{"i":86,"t":"Working with Outputs","ex":true,"n":"为加快速度先注释掉 EC2、只保留 S3 资源，plan 显示创建两个资源后执行 apply -auto-approve；此时 CLI 能看到 bucket 名却无法在 Terraform 外部使用，推荐新建 outputs.tf 输出 aws_s3_bucket.project_bucket.bucket；apply 后出现 outputs 部分且资源无变化，terraform output -json 还会带上未显式指定的属性，模块输出也可在根项目引用。"},{"i":87,"t":"Working with Sensitive Values（任务预览）","ex":true,"n":"本练习聚焦敏感值在 Terraform 中的工作原理，说明 Terraform 在幕后如何处理它，并提供 exercise 21 的分步操作指南；可暂停录像前往该文件按步骤操作，再回来观看解决方案。"},{"i":88,"t":"Working with Sensitive Values","ex":true,"n":"给 output 加 sensitive = true 后 apply，CLI 输出被遮蔽，但 terraform output -json 仍会显示 sensitive 为 true 且值照样暴露，terraform output s3_bucket_name 也能取到，说明只是显示层遮蔽、state 中仍是明文；variable 同样可标 sensitive = true，输入时不回显；最后销毁两个资源。"}]},{"n":9,"dir":"9 - Expressions and Functions","stage":"阶段 3 · 进阶","zh":"表达式与函数","points":[{"t":"运算符与表达式基础","d":"在 locals 中用乘法、负数等数学运算符演示原始运算，并用 required_version 约束版本区间；数字主要靠运算符，其他值类型更多依赖函数。"},{"t":"for 表达式处理 list 与 map","d":"[for v in list : expr] 生成列表、{for k, v in map : k => expr} 生成映射；list 只有一个临时变量，map 有键和值两个，末尾都可加 if 过滤子句。"},{"t":"list 与 map 互相转换","d":"以 users 对象列表为例，遍历列表生成映射、再反向遍历映射生成列表，用 ... 省略号简化重复结构，并通过反复执行 plan 验证输出。"},{"t":"splat 表达式","d":"用 splat 一行取出列表中所有元素的某个属性，替代冗长的 for 循环；它只适用于列表及类列表值类型，不能用于 map，map 场景可用 values() 等函数。"},{"t":"内置函数分类总览","d":"查阅路径是 developer.hashicorp.com 的 Terraform 主页 → 文档 → 配置语言 → 函数；含数值、字符串、集合等函数，不能自定义函数，can 常用于变量校验。"},{"t":"综合练习：函数实战","d":"在 10-functions 目录用 locals 试 name、age 等示例，练习字符串与数值函数的嵌套组合，并反复用 terraform plan 验证、terraform fmt 整理格式。"}],"goal":"熟练使用 for、splat 表达式转换集合，并用内置函数完成字符串与数值处理","lessons":[{"i":89,"t":"Operators in Terraform（任务预览）","ex":true,"n":"本练习聚焦如何在 Terraform 中使用运算符，配套提供了详细的分步指南。可以暂停视频、打开练习 22 文件跟着自己操作一遍，做完再回来观看解决方案视频，后续几节会逐项讲解对应的写法与验证方式。"},{"i":90,"t":"Operators in Terraform","ex":true,"n":"新建 09_expressions 文件夹，创建 locals.tf 与 provider.tf 里的 terraform 块，用 required_version 把版本约束在 >=1.7 且 <2.0。在 locals 中演示乘法、负数等数学运算符，并提到 log、power 这类函数；output 拼错时可用 terraform format 整理。随后 init、plan 验证：数字靠运算符，其他类型主要靠函数。"},{"i":91,"t":"Using for Expressions with Lists（任务预览）","ex":true,"n":"本练习目标是学会用 for 表达式处理列表：先创建两个变量，一个是数字列表，另一个是带特定属性的对象列表；再用 double_numbers 把数字列表每个元素翻倍，并额外产出 even_numbers 过滤结果。建议先自行尝试，再打开练习 23 文件看解答。"},{"i":92,"t":"Using for Expressions with Lists","ex":true,"n":"把文件改名为 operators.tf 以便分区讨论，新建 variables.tf 声明 numbers_list 为数字列表类型，值 1~5 写在 terraform.tfvars 里。在 locals 中用 [for num in var.numbers_list : num * 2] 生成翻倍列表，并在表达式末尾追加 if 过滤条件得到偶数列表，最后用 plan 检查输出。"},{"i":93,"t":"Using for Expressions with Maps（任务预览）","ex":true,"n":"本练习把重点转到用 for 表达式操作 Terraform 中的映射，课程列出了本练习的预期成果。建议暂停视频、先到仓库中的练习 24 文件自己动手尝试，之后再回来观看解答录制中的详细讲解，对照检查生成的映射是否符合预期。"},{"i":94,"t":"Using for Expressions with Maps","ex":true,"n":"上一讲的文件重命名为 for_lists.tf，新建 for_maps.tf。variables.tf 中已有 objects_list，这里先用更简单的 numbers_map，在 terraform.tfvars 里赋值 1~5。在 locals 中用 {for k, v in var.numbers_map : k => v * 2} 生成 doubles_map：map 的 for 有键和值两个临时变量、用 => 分隔，末尾同样可加过滤；map 用花括号生成映射，列表用方括号。"},{"i":95,"t":"Transforming Lists into Maps and Vice Versa（任务预览）","ex":true,"n":"本练习重点是把列表转换成映射，以及把映射转换成列表，比前面两节稍复杂。讲师已尽量把期望结果写清楚，方便你先自己动手验证。强烈建议暂停视频、打开练习 25 文件先做一遍，再回来观看解决方案讲解。"},{"i":96,"t":"Transforming Lists into Maps and Vice Versa","ex":true,"n":"新建 lists-maps.tf 与 users 变量（对象列表，属性为 username 与 role 两个字符串），在 terraform.tfvars 中给出三个用户：John 是管理员、Jane 是开发者、Laura 是审计员。terraform format 后在 locals 中遍历 users 生成映射、再反向遍历映射生成列表，并用 ... 省略号简化重复写法，反复 plan 验证输出。"},{"i":97,"t":"Using Splat Expressions","ex":false,"n":"新建 splat.tf，直接复用已有的 var.objects_list，在 locals first_names_from_splat 中用 splat 语法一行取出所有元素的 first_name，等价于 for 循环但更简洁，随后用 plan 验证。注意 splat 只适用于列表及类列表值类型，不能用于 map，不兼容时 Terraform 会直接报错，map 场景可改用 values() 之类的函数。"},{"i":98,"t":"Introduction to Functions","ex":false,"n":"介绍 Terraform 的内置函数并给出查阅路径：developer.hashicorp.com 的 Terraform 主页 → 文档 → 配置语言 → 函数章节。其中有数值函数（abs、ceil、floor、log、max、min 及幂运算）、字符串函数、集合函数等；Terraform 暂时不能创建自定义函数，只能利用已有函数，can 函数会在变量校验等场景反复用到。"},{"i":99,"t":"Working with Functions（任务预览）","ex":true,"n":"本练习目标是建立在 Terraform 中使用函数的基础。虽然无法自定义函数，但 Terraform 提供了非常丰富的内置函数供使用。练习附有分步指南，建议先暂停视频、到练习 26 文件跟着操作一遍，再回来观看解决方案视频。"},{"i":100,"t":"Working with Functions","ex":true,"n":"新建 10-functions 目录与 provider.tf，只写 required_version，不需要 AWS provider（这节不创建任何 AWS 资源，用到再加），执行 terraform init。不建 variables.tf 而改用 locals，在 functions_examples.tf 中示例 name、age 等局部值，演示字符串与数值函数（如 power 需要第二个参数）并把函数嵌套组合，最后 terraform fmt 收尾。"}]},{"n":10,"dir":"10 - Creating Multiple Resources","stage":"阶段 4 · 规模化","zh":"批量创建资源","points":[{"t":"count 元参数","d":"决定要创建的资源实例个数，可写在单个资源或模块里，既能硬编码也能取自变量；必须在 Terraform 执行任何远程操作之前就确定下来。"},{"t":"for_each 元参数","d":"接受一个映射或字符串集合（如 toset 结果），块内用 each.key、each.value 取值；只要键保持稳定，Terraform 就能准确找到对应资源。"},{"t":"引用 count 创建的资源","d":"aws_instance.name[索引] 访问某一个具体实例，只写 aws_instance.name 则拿到全部实例；常把 count.index 拼进 Name 标签区分实例，也是销毁时定位的依据。"},{"t":"基于 List 变量批量建 EC2","d":"list(object({instance_type, ami})) 配 count = 列表长度，用 count.index 取出元素配置实例，并用取模运算轮询分配子网；调整列表顺序会导致实例被重建。"},{"t":"基于 Map 变量批量建 EC2","d":"改用 map(object) + for_each，每个键就是一个稳定标识、each.value 是该键对应的配置；重排顺序不会引发销毁重建，更适合长期维护。"},{"t":"变量 validation 进阶","d":"对 object 列表逐元素校验：用 for 表达式先映射成字符串列表，再映射成布尔列表，最后检查是否全为 true；断言失败要给出可读的错误信息。"},{"t":"接收 Subnet 信息","d":"把硬编码的子网数量变量换成 map(object({cidr_block})) 的 subnet_config，子网用 for_each 创建，实例即可按 key 精确引用对应子网。"}],"goal":"用 count 与 for_each 批量创建子网与 EC2 实例，并用 validation 约束变量配置","lessons":[{"i":101,"t":"Working with count and for_each","ex":false,"n":"对比 count 与 for_each：count 决定资源实例个数，单个资源和模块都能用，且必须在执行远程操作前确定；可用 aws_instance.name[索引] 访问单个实例，只写 aws_instance.name 则引用全部实例，名称里常拼 count.index。for_each 接受映射或字符串集合，键稳定就不依赖顺序。"},{"i":102,"t":"Creating Multiple Subnets with the Count Meta-Argument（任务预览）","ex":true,"n":"任务预览：暂停视频，打开练习 27 文件。本练习聚焦用 count 元参数把两份几乎一样的子网资源合并成一份，批量创建多个子网；先看预期结果，想自己动手就暂停尝试，之后回来观看解法讲解。"},{"i":103,"t":"Creating Multiple Subnets with the Count Meta-Argument","ex":true,"n":"新建 11-multiple-resources 目录，写 provider.tf（required_version ~> 1.7、hashicorp/aws ~> 5.0、region eu-west-1）并 init；networking 中先手写两个相似的 VPC 子网（Cidr 分别为 10.0.1.0/24、10.0.2.0/24 避免重叠），再加 locals；随后用 count 元参数替换重复代码，可先硬编码试试，plan 应无差异。"},{"i":104,"t":"Referencing Resources with the Count Meta-Argument（任务预览）","ex":true,"n":"任务预览：暂停视频，打开练习 28 文件。本练习重点是如何引用前面用 count 参数批量创建出来的资源，先看清预期结果，再回来观看具体的引用写法与注意事项。"},{"i":105,"t":"Referencing Resources with the Count Meta-Argument","ex":true,"n":"新增 ec2_instance_count（number，默认 1），在 compute.tf 写 aws_instance 并设 count = var.ec2_instance_count；从 data 目录复制 Ubuntu AMI 数据源，把 locals 中的 ami_ids 挪到 data.tf 供计算资源共用；instance_type 硬编码 t2.micro，Name 标签拼 count.index 区分；收尾销毁 7 个资源（1 VPC、2 子网、4 实例）。"},{"i":106,"t":"Creating EC2 Instances based on a List Variable（任务预览）","ex":true,"n":"任务预览：暂停视频，打开练习 29 文件。本练习学习如何利用 count 参数基于一个列表变量批量创建多个 EC2 实例，让每个实例的规格可由变量逐项指定；文件里另附分步指南，卡住时可先看提示。"},{"i":107,"t":"Creating EC2 Instances based on a List Variable","ex":true,"n":"定义 ec2_instance_config_list，类型为 list(object({instance_type=string, ami=string}))，先不用 AMI ID 而传镜像名；从 tfvars 删掉 ec2_instance_count；复制原 count 资源，把 count 设为该列表长度，用 count.index 索引列表取实例类型与镜像，并沿用取模轮询子网的写法；结尾预告要扩展 ami_ids 支持 nginx。"},{"i":108,"t":"Allowing Multiple AMIs in the EC2 Configuration Variable（任务预览）","ex":true,"n":"任务预览：暂停视频，打开练习 30 文件。本练习建立在上一个练习基础上，目标是让用户在配置对象的 ami 属性里除了 Ubuntu 之外还能传入 nginx 镜像，其余资源与参数保持不变。"},{"i":109,"t":"Allowing Multiple AMIs in the EC2 Configuration Variable","ex":true,"n":"复制 Ubuntu 的 AMI 数据源，改成 aws_ami.nginx：条目改为 nginx、去掉 owners、修改名称过滤器的值；在 local.ami_ids 中加入 nginx = data.aws_ami.nginx.id。这样用户只传字符串镜像名，AMI ID 就能自动查出来；plan 后 apply 验证，然后快速销毁部署避免额外费用。"},{"i":110,"t":"Adding Validation to the List Variable（任务预览）","ex":true,"n":"任务预览：暂停视频，打开练习 31 文件。本练习给列表变量加验证，共两条：实例类型只允许 t2.micro，镜像只允许 ubuntu 或 nginx，用在 plan 阶段就拦住非法配置。"},{"i":111,"t":"Adding Validation to the List Variable","ex":true,"n":"在 validation 块里三步走：先用 for 表达式把对象列表映射成实例类型字符串列表，再映射成判断是否等于 t2.micro 的布尔列表，最后检查是否全为 true；镜像的验证用同样套路，只允许 ubuntu、nginx。错误信息要提示若所在区域免费套餐含 t3.micro 可改用它；先填非法值跑 plan 看报错。"},{"i":112,"t":"Creating EC2 Instances based on a Map Variable（任务预览）","ex":true,"n":"任务预览：暂停视频，打开练习 32 文件。本练习把上一节的列表变量换成映射变量来创建 EC2 实例，先看预期成果和应该部署出来的资源，文件内也提供分步指南。"},{"i":113,"t":"Creating EC2 Instances based on a Map Variable","ex":true,"n":"先把上节的非法值改回有效值 apply 成功，再演示列表的痛点：把 nginx 与 ubuntu 的顺序对调后 apply，Terraform 认为 AMI ID 变了，会销毁旧实例、重建两个新实例。由此引出映射：定义 config_map（键为标识、值为实例配置）并改用 for_each，键稳定就不会因顺序变化而重建；也可以显式告知 Terraform 这处变更，让它更新状态以跟踪新的索引。"},{"i":114,"t":"Adding Validation to the Map Variable（任务预览）","ex":true,"n":"任务预览：暂停视频，打开练习 33 文件。本练习为映射变量添加与列表相同的验证，同样限制实例类型与可用镜像，做法可以对照上一节的 validation 块。"},{"i":115,"t":"Adding Validation to the Map Variable","ex":true,"n":"把列表的验证复制过来并改成遍历映射：可以写 for config in var.config_map 直接取每个值，或用 values(var.config_map) 先得到配置列表，也可以用 for key, config 同时拿键与值；之后同样生成实例类型字符串列表、布尔列表并检查全为 true。先填非法值跑 plan 看报错，收尾销毁 5 个资源并在控制台确认全部终止、不再计费。"},{"i":116,"t":"Extending the Configuration to Receive Subnet Information（任务预览）","ex":true,"n":"任务预览：暂停视频，打开练习 34 文件。本练习扩展现有配置，让 EC2 实例能够接收子网信息，先看预期结果，文件内还提供了详细的分步指南。"},{"i":117,"t":"Extending the Configuration to Receive Subnet Information","ex":true,"n":"代码清理：变量里移除 ec2_instance_count 与 ec2_instance_config_list（后者保留空列表默认值作文档，方便继续用验证块），把子网数量变量改成 subnet_config，类型为 map(object({cidr_block=string})) 且去掉默认值；networking 中子网改用 for_each = var.subnet_config 取代 count，并删掉依赖 count.index 的命名；实例即可按 key 精确引用对应子网。fmt、plan 通过后销毁 5 个实例。"}]},{"n":11,"dir":"11 - Project - IAM User Management","stage":"阶段 5 · 项目","zh":"项目：IAM 用户管理","points":[{"t":"用 YAML 存用户/角色数据","d":"user_roles.yaml 里 users 是对象数组，每项含 username 与 roles 列表。比直接改 .tf 更解耦，产品负责人等非技术人员也能自行添加用户，但仍需了解 YAML 语法。"},{"t":"for_each + yamldecode 建用户","d":"用 file() 读取、yamldecode() 解码得到 users_from_yaml，再用 splat 表达式映射出用户名列表配 for_each 批量建 aws_iam_user，并为每个用户创建 login_profile。"},{"t":"用户密码输出与安全提醒","d":"password_length 至少 8 个字符，传更短会失败。课程为了测试登录直接把密码输出到控制台，并强调生产环境绝不能这么做，应把密码安全地交付给用户。"},{"t":"AWS 托管策略 vs 自定义策略","d":"托管策略由 AWS 预置，如 ReadOnlyAccess、AdministratorAccess、SecurityAudit 以及各服务的 FullAccess。角色本身默认什么都做不了，必须附加策略才真正有权限。"},{"t":"创建 IAM Role 与 assume role policy","d":"用 aws_iam_role 加 for_each 建只读/管理员/审计员/开发者四个角色，先由 data aws_iam_policy_document 生成 assume_role_policy，再用 aws_iam_policy_attachment 把托管策略挂上去。"},{"t":"限制可扮演角色的 Principal","d":"为每个角色单独生成一份 assume role policy，标识列表里只放 YAML 中该角色 users 列表内的用户，修掉此前「任何用户都能代入所有角色」的安全隐患。"},{"t":"测试与清理","d":"逐个用新建用户登录控制台，验证只能切换到分配给自己的角色、权限确实生效，确认无误后用 terraform destroy 一次性回收所有用户、角色与策略。"}],"goal":"用 YAML 数据驱动完整实现 IAM 用户、角色与最小权限模型并验证","lessons":[{"i":118,"t":"Project Overview","ex":false,"n":"项目目标是用 Terraform 管理 IAM 用户与角色。需准备一个 YAML 格式的用户数据文件，存放用户名及各自的角色；Terraform 侧存放角色名称与对应要附加的策略。提示：想省事可直接用 AWS 托管策略，想增加挑战就自己写策略。关键要求是每个角色只能由 YAML 中对应角色下列出的用户扮演，且绝不通过其他安全平台共享密码。"},{"i":119,"t":"Storing User and Role Information in YAML","ex":false,"n":"新建 project02 目录与 user_roles.yaml，users 键下是对象数组，每项含 username 和 roles 列表，先写 John、Jane、Laura 三个用户，再考虑要建哪些角色。YAML 比直接写 Terraform 代码更解耦，非技术人员也能加用户。provider.tf 只需 terraform 块；users.tf 里建 locals，用 file() 读取、yamldecode() 解码，访问 users 键得到 users_from_yaml，并用 output users 打印验证。"},{"i":120,"t":"Creating Users in AWS","ex":false,"n":"用 YAML 数据在 AWS 账户中创建 IAM 用户。资源 aws_iam_user 命名为 users，用 splat 表达式把 users_from_yaml 映射成只含用户名的列表配 for_each 批量创建（for_each 实际作用在 set 上）。两个常见坑：忘写 required_providers 会报错，补上后要重新 terraform init；参数类型不对会出现 for_each 参数无效的错误。apply 后用户已存在，但还不能登录。"},{"i":122,"t":"Creating User Passwords","ex":false,"n":"新建 aws_iam_user_login_profile 资源 login_profiles，遍历 aws_iam_user.users 为每个用户生成控制台密码。参数 user 传用户名（不是 ARN），password_length 至少 8 个字符，传更短会失败。课程为了专注管理用户并登录控制台检查，直接用 output 把密码打印出来，并强调现实中绝不该这样做；权限不会直接附加给用户或加组，而是之后通过其可代入的角色授予。"},{"i":123,"t":"Understanding AWS Managed Policies","ex":false,"n":"新建用户已能登录控制台但没有任何权限，权限将通过其可代入的角色来授予；而角色本身默认什么都做不了，必须附加策略。本节在 IAM 控制台浏览 AWS 托管策略：AdministratorAccess 允许对所有资源做任何操作，还有 EC2 完全访问权限、EC2 只读访问权限等按服务划分的策略，理解这些策略的粒度以便稍后直接在项目里使用。"},{"i":124,"t":"Creating Roles","ex":false,"n":"新建 roles.tf，先在 locals 里定义 role_policies 这个 map（键为角色名）：只读用 ReadOnlyAccess，管理员用 AdministratorAccess，审计员用 SecurityAudit，开发者用 AmazonVPCFullAccess、AmazonEC2FullAccess、AmazonRDSFullAccess。然后用 aws_iam_role 加 for_each 创建这四个角色，并提供由 data aws_iam_policy_document 生成的 assume_role_policy（引用 data.aws_iam_policy_document.assume_role_policy.json）。此时角色已存在但没附加任何策略，还不能做任何事。"},{"i":125,"t":"Defining Assume Role Policies for Each Role","ex":false,"n":"role_policies 方便管理但不适合直接 for_each，所以在 locals 里新增 role_policies_list：对 role, policies 做映射，把每个策略展开成含 role 与 policy 的对象，并用 flatten 修正嵌套结构。先 output policies 打印确认；再用 data aws_iam_policy 加 splat 表达式取 AWS 托管策略的 ARN（前缀 arn:aws:iam::aws:policy/），通过 aws_iam_policy_attachment 挂到各角色。测试时发现当前用户竟能代入包括管理员在内的全部角色，留下安全隐患。"},{"i":126,"t":"Restricting Which Principals Can Assume Each Role","ex":false,"n":"问题在于同一份 assume role policy 被附到所有角色上，等于任何用户都能代入任意角色。改法：用 for_each 遍历角色，为每个角色生成独立的 aws_iam_policy_document，标识列表里只放 roles 列表中包含该角色的用户。注意 data 块不是真实资源，只是 Terraform 用来定制要创建资源的配置数据，加 for_each 后 plan 会显示多个待建项。plan 确认无误再 apply。"},{"i":127,"t":"Testing, Wrap-Up and Project Conclusion","ex":false,"n":"复盘全流程：从 user_roles.yaml 的 users 列表出发，file() + yamldecode() 得到 users_from_yaml，splat 表达式配 for_each 建 aws_iam_user，password_length 为 8 建 login_profile；再定义只读、管理员、审计员、开发者四类角色及对应 AWS 托管策略，用 data aws_iam_policy 查策略 ARN、data aws_iam_policy_document 生成各自的 assume role policy。最后逐个用户登录验证只能代入分配到的角色，再用一条命令清理所有资源。"}]},{"n":12,"dir":"12 - Modules","stage":"阶段 6 · 工程化","zh":"模块 Modules","points":[{"t":"模块是什么与复用价值","d":"从技术上讲模块只是保存在同一目录下的一组 Terraform 文件；区分 root module 与 child module，模块用来组织、封装、复用常一起使用的资源。"},{"t":"标准模块目录结构","d":"LICENSE、main.tf、variables.tf、outputs.tf、README.md 组成的推荐最小文件集；main.tf 只是惯例，复杂模块可按资源拆成 vpc.tf 等命名贴切的文件。"},{"t":"在 Registry 浏览公开模块","d":"在 registry.terraform.io 首页点 Browse Modules 浏览列表，顶部可在 provider 与 module 间切换；模块依赖 provider（如 AWS），本身只是资源的封装集合。"},{"t":"读懂 AWS VPC/EC2 模块源码","d":"从 Registry 模块页的 Source code 跳到 GitHub 仓库，看 main.tf 里的 resources 与 locals 分区、variables.tf 对应页面 inputs，以及与 Registry 一致的 README。"},{"t":"调用公开 VPC/EC2 模块","d":"写 module 块指定 source（terraform-aws-modules/vpc/aws 等）与固定 version，用 locals 收敛 cidr、项目名与公共标签；init 会把模块下载到 .terraform/modules。"},{"t":"模块设计最佳实践","d":"识别值得抽取的抽象边界与强关联资源组、隐藏内部细节；相关变量归入 object，稳定资源与频繁变更资源分模块，保持精简扁平可组合，不做大而全。"},{"t":"自建 VPC 模块全流程","d":"从本地模块骨架到 object 变量、map(object) 子网配置、可用区 validation、公私子网与 IGW 路由，最后定义 vpc_id 与子网 ID 等 outputs。"},{"t":"用 EC2 实例测试模块","d":"根模块建 compute.tf，复制 AMI 数据源与 aws_instance 资源，直接用 module.vpc 输出的 subnet_1_id 验证模块；验证完销毁资源，避免实例产生费用。"},{"t":"补齐 LICENSE 与 README","d":"选定 MIT 等许可证并考虑复用传染性；README 写清支持的 Terraform/provider、输入输出与用法示例，examples 目录放不同使用模式，Registry 用它生成文档。"},{"t":"发布模块到 Registry","d":"满足公开 GitHub 仓库、README、LICENSE、标准模块结构等要求，在 Registry 发布新 tag 即可被 module source 引用；建议用 CI/CD 流水线自动发布。"}],"goal":"掌握模块设计最佳实践，独立实现并测试一个 VPC 模块，最终发布到 Terraform Registry","lessons":[{"i":128,"t":"What Are Modules","ex":false,"n":"从模块是什么讲起：技术上模块只是保存在同一目录下的一组 Terraform 文件，我们至今写的所有配置都属于 root module，再调用其他模块就是 child module。模块用来把常一起使用的资源组织、封装和复用。"},{"i":129,"t":"The Standard Module Structure","ex":false,"n":"HashiCorp 推荐的标准模块结构（推荐而非强制）：LICENSE 说明他人如何使用本模块，main.tf 作为资源主入口，简单模块可全放 main.tf，复杂模块可拆成 vpc.tf 等命名贴切的文件；另有 variables.tf、outputs.tf、README.md。"},{"i":130,"t":"Browsing Public Modules in the Terraform Registry","ex":false,"n":"在 Terraform Registry 首页点 Browse Modules 浏览模块列表，顶部可在 provider 与 module 之间切换。要注意模块依赖 provider（如 terraform-aws-modules/vpc/aws 需要 AWS provider），模块并不独立于 provider；私有 Registry 底层流程类似。"},{"i":131,"t":"Exploring the AWS VPC Module GitHub Repository","ex":false,"n":"从模块页的 Source code 跳到托管它的 GitHub 仓库：根目录几乎没有子目录，只有 main.tf、variables.tf、outputs.tf、LICENSE、README.md；main.tf 里用 locals 与注释组织大量资源，README 与 Registry 主页内容完全一致。"},{"i":132,"t":"Using the Public AWS VPC Module（任务预览）","ex":true,"n":"练习 35 预览：学习如何在 Terraform 项目里调用公共 AWS VPC 模块。需要暂停视频自己动手的，直接打开对应练习文件完成后再回来，目标是在新目录里写出引用该模块的配置。"},{"i":133,"t":"Using the Public AWS VPC Module","ex":true,"n":"新建 12_public_modules 目录并 touch networking.tf，写 module \"vpc\"（名字随意），source 填 terraform-aws-modules/vpc/aws，version 固定为 5.5.3 以保证课程示例都能跑通；terraform init 后模块被下载到 .terraform/modules。"},{"i":134,"t":"Using the Public AWS EC2 Module（任务预览）","ex":true,"n":"练习 36 预览：用公共 AWS EC2 模块创建一台 EC2 实例，同时复用上一练习创建的 VPC 模块，从它那里取到传给实例模块所需的信息。练习文件里给出了预期成果，可暂停后自行完成。"},{"i":135,"t":"Using the Public AWS EC2 Module","ex":true,"n":"先做重构：把 cidr 提取为 locals.vpc_cidr，新建 shared_locals.tf 定义 project_name 与 common_tags（project、managed_by = Terraform），再把 private_subnet_cidrs、public_subnet_cidrs 提出来供 VPC 模块引用，最后用模块输出起实例并在控制台验证。"},{"i":136,"t":"Module Design Best Practices","ex":false,"n":"何时该抽模块：存在可视为整体的底层抽象、强关联总一起创建的资源组（技术边界），或想隐藏内部细节改善体验。相关联的变量尽量归入 object；把基本不变的资源（如 S3 桶）与频繁改动的资源（如 EC2）拆成不同模块，保持精简扁平。"},{"i":137,"t":"Building Our Own VPC Module（任务预览）","ex":true,"n":"练习 37 预览：开始创建自己的 networking 模块，整体实现会拆到多个练习，一次专注一个方面。本次先说明模块要提供的核心能力，并对应第一个练习的预期成果。"},{"i":138,"t":"Building Our Own VPC Module","ex":true,"n":"在根目录新建 13-local-modules，以 06-resources 里的 networking 为蓝本，在 modules/networking 下先写 README 定义模块：创建一个指定 cidr 块的 VPC、允许配置多个子网，并把底层资源抽象掉；根模块传入 10.0.0.0/16 后 plan 通过且无变更。"},{"i":139,"t":"Migrating to Object Variables（任务预览）","ex":true,"n":"练习 38 预览：把模块的输入变量迁移为对象变量，这是一个练习处理不同类型输入变量的好机会。练习文件里给出了本节的预期成果，可自行尝试后再回来看实现。"},{"i":140,"t":"Migrating to Object Variables","ex":true,"n":"模块里不用 main.tf，改建 vpc.tf 放 aws_vpc：cidr_block 取 var.vpc_cidr，tags 的 name 取新建的 string 变量 vpc_name；根模块传值后 init 与 apply 成功，控制台可见 VPC。接着新建 vpc_config，准备按功能把散装变量归组。"},{"i":141,"t":"Receiving Subnet Configuration via Variables（任务预览）","ex":true,"n":"练习 39 预览：扩展 VPC 模块让它接收子网配置，需要新增一个变量和一批新资源，并使用 for_each 循环。练习文件中给出了预期结果，可暂停后自己动手实现。"},{"i":142,"t":"Receiving Subnet Configuration via Variables","ex":true,"n":"在 modules/networking/variables.tf 里新建 subnet_config，类型不是单个 object 而是 map(object)：键不重要，为的是能创建多个子网，目前每个对象只含 cidr_block。根模块传入 subnet-one 这样的键值对后运行 plan，因资源未创建故无变化。"},{"i":143,"t":"Validating the Received Availability Zones（任务预览）","ex":true,"n":"练习 40 预览：给模块收到的输入加上 validation，具体是校验传入的 AWS 可用区是否真实有效，避免错误值一直拖到 apply 才暴露。练习文件里附有预期结果。"},{"i":144,"t":"Validating the Received Availability Zones","ex":true,"n":"先故意传 eu-central-1b：plan 能通过，但 apply 返回无效参数，因为它不属于 eu-west-1 区域。改进方案是加 data \"aws_availability_zones\" \"available\"（state = \"available\"），再用它的 names 配合 preconditions 与 join() 在 plan 阶段就拦住非法 AZ。"},{"i":145,"t":"Supporting Public and Private Subnets（任务预览）","ex":true,"n":"练习 41 预览：扩展模块以支持公共与私有子网。这节不只是 Terraform 技术细节，还涉及模块设计决策与应追求的最佳实践，练习文件里列出了预期成果。"},{"i":146,"t":"Supporting Public and Private Subnets","ex":true,"n":"在 subnet_config 对象里新增 public 可选属性，类型 bool、默认 false；用 locals.public_subnets 过滤出公共子网，数量大于 0 才创建互联网网关、到 IGW 的路由并做显式关联，私有子网则依赖隐式关联。调试时先通过 module.vpc.public_subnets 输出观察过滤结果。"},{"i":147,"t":"Defining the Module's Outputs（任务预览）","ex":true,"n":"练习 42 预览：为自建的 VPC 模块创建几个 outputs，让调用方能拿到真正有用的信息。练习文件里除了预期结果，还提供了详细的逐步操作指南，可以自行完成后再看解答。"},{"i":148,"t":"Defining the Module's Outputs","ex":true,"n":"原输出只是把收到的公共子网配置原样反射回来，没暴露任何 ID，外部资源无法关联。改为输出 VPC ID（模块内的 aws_vpc）、public_subnets 与 private_subnets 对象，各自含 subnet_key 和来自 aws_subnet 的 subnet_id；是否多暴露取决于使用场景。"},{"i":149,"t":"Populating the License and README Files","ex":false,"n":"本模块采用 MIT 许可证，并提醒许可证会影响使用者的复用方式（例如 GPL 会要求衍生代码也开源），要先决定开源还是闭源。README 里写清支持的 Terraform 与 provider、VPC 配置、变量和输出，并建 examples 目录放不同使用模式的示例。"},{"i":150,"t":"Testing the Module with EC2 Instances（任务预览）","ex":true,"n":"练习 43 预览：用模块输出的信息创建 EC2 实例，从而验证已实现的 networking 模块确实可用。练习文件里附有详细的步骤指南，可暂停后自己尝试再回来。"},{"i":151,"t":"Testing the Module with EC2 Instances","ex":true,"n":"根模块新建 compute.tf，从之前目录复制 data.aws_ami（Ubuntu）与 aws_instance 资源，去掉 count 改为单实例，标签用 locals.project_name，子网直接取 module.vpc 的 subnet_1_id；plan 确认输出子网 ID 后 apply，最后销毁全部十个资源——子网和 VPC 免费，实例才计费。"},{"i":152,"t":"Publishing Modules in the Terraform Registry","ex":false,"n":"发布模块的硬性条件：模块必须托管在 GitHub 上（仅公共 Registry 要求，私有 Registry 可忽略），仓库名要能描述模块管理的基础设施，并写好会显示在 Registry 的简短描述；同时遵循标准模块结构，outputs 与 variables 尤其重要，Registry 还提供版本控制、自动生成文档、浏览版本历史等能力。"},{"i":153,"t":"Publishing Our Networking Module","ex":false,"n":"实操发布：新建公开 GitHub 仓库（模板选 Terraform、provider 选 AWS，命名如 networking-tf-course，填好描述、加 README、.gitignore 模板、MIT 许可证），git clone 后把 networking 模块文件复制进去，再到 Registry 发布新 tag 完成发布；手动发布只为演示，实际应搭 CI/CD 流水线。"}]},{"n":13,"dir":"13 - Object Validation","stage":"阶段 6 · 工程化","zh":"对象校验","points":[{"t":"precondition 与 postcondition","d":"两者都写在资源或数据块的 lifecycle 块中；precondition 不能引用资源自身，只能校验资源外部的数据或变量，postcondition 则可以引用定义它的那个资源本身。"},{"t":"check 断言块","d":"较新的 Terraform 版本才提供，内部用 assert 写 condition 与 error_message；用于非关键检查，失败只发出警告，不会中断 terraform apply 的执行。"},{"t":"校验的执行时机与顺序","d":"plan 阶段先判断校验所需信息是否已可用，可用就当场执行、不可用则推迟到 apply；plan 阶段就失败的校验会让 Terraform 报错退出，不进入 apply。"}],"goal":"用 precondition、postcondition 与 check 在 plan 阶段就挡住非法配置","lessons":[{"i":154,"t":"Preconditions and Postconditions","ex":false,"n":"介绍除变量 validation 之外的另外三种对象验证方式。precondition 与 postcondition 都定义在资源或数据块的 lifecycle 块中：precondition 不能引用资源自身，只能作用于资源或数据块之外的数据（变量、外部 data source 的结果）；postcondition 则可以引用定义它的那个资源本身。第三种是较新版本才有的 check 断言。本节先建立概念，细节留给练习。"},{"i":155,"t":"Working with Preconditions（任务预览）","ex":true,"n":"本练习目标是学会在 Terraform 中使用前置条件，讲师建议先自行浏览 Terraform 文档中的相关内容。练习列出了应当达成的目标与分步指南：暂停视频、前往练习 44 文件动手尝试，之后再回来观看解决方案讲解，并在解答中对照检查 precondition 的写法是否正确。"},{"i":156,"t":"Working with Preconditions","ex":true,"n":"新建 15-object-validation 目录与 provider.tf（required_version、hashicorp/aws 5.0、provider 块 region 设为 eu-west-1）。先回顾第 08 节变量 validation 的局限：只能引用变量自身且常被硬编码，无法验证动态或其他来源的信息。再打开 local-modules 下 networking 模块的 VPC，其 lifecycle 里已有 precondition 块——它更灵活，且在 for_each 与 count 求值之后执行，能用到遍历子网配置产生的信息；引用资源自身则要用 postcondition。"},{"i":157,"t":"Working with Postconditions（任务预览）","ex":true,"n":"本练习目标是学会 postcondition 的用法，除了具体实现的技术细节，还会重点讨论 postcondition 何时求值这一容易混淆的问题。练习提供预期成果与分步指南，建议先暂停视频、打开 exercise 45 文件自己动手实现，再回来继续课程并对照解答讲解。"},{"i":158,"t":"Working with Postconditions","ex":true,"n":"先清理变量让其实例类型有有效值，运行 terraform fmt 与 plan，并区分信息的可得性：来自 data source 的 AMI ID、t2.micro 实例类型 plan 阶段已知；实例状态、子网 ID、可用区要等资源真正创建后才可见。依赖它们的后置条件不会在 plan 阶段运行，只在 apply 之后运行；示例的两个 postcondition 块验证了直接引用资源自身 instance_type 可在 plan 阶段执行。最后 terraform destroy 输入 yes 销毁实例与子网。"},{"i":159,"t":"When Are Preconditions and Postconditions Run","ex":false,"n":"用一张流程图澄清执行时机：plan 阶段（无论 terraform plan 还是 terraform apply 内部都会出现）Terraform 先检查校验所需信息是否已可用，可用就立即执行、不可用则推迟；plan 阶段就失败的校验会让 Terraform 报错退出，根本不进入 apply。apply 阶段是一个循环，随着资源逐步创建、更多值写入 state，先前不可用的信息变得可用，被推迟的校验才执行——时机因此是动态的。"},{"i":160,"t":"Working with Check Blocks（任务预览）","ex":true,"n":"本练习探索如何使用检查块（check）：它是执行基础设施非关键检查的好办法。课程给出了部署后的预期结果，建议你暂停视频、前往练习 46 文件，先浏览其中的 Terraform 配置了解这些检查块是怎么写出来的，再回来继续课程与讲师一起验证效果。"},{"i":161,"t":"Working with Check Blocks","ex":true,"n":"check 块不会导致错误也不会中断 terraform apply，只会发出警告，适合提示潜在错误或次优配置。示例用 check 块内的 assert（同样是 condition + error_message 结构）检查 aws_instance.this.tags 是否含 cost_center 标签；terraform fmt -recursive 后运行 plan 即可看到检查结果，apply 完成且不阻止 EC2 部署，补上标签后警告消失。最后 destroy 只销毁 state 里的资源，未 apply 的子网不受影响。"}]},{"n":14,"dir":"14 - State Manipulation","stage":"阶段 6 · 工程化","zh":"状态操作 State Manipulation","points":[{"t":"state 操作总览","d":"说明 state 的作用与何时需要手工操作：资源异常损坏、已有资源想纳管、只想停止跟踪，或需要强制解除卡住的状态锁、从远程后端拉取推送状态。"},{"t":"重构资源：state mv 与 moved","d":"移动资源有两条路径：terraform state mv 命令与 moved 块；配合 terraform fmt -recursive、init 与 apply 验证，改资源地址或拆文件而不重建实例。"},{"t":"导入已有资源","d":"对已在 AWS 手工创建、或由别的团队从其 Terraform 中移交出来的资源，用 CLI 或 import 块导入；先查 provider 文档的 import 说明，块可放资源旁或单独文件。"},{"t":"移除但不销毁资源","d":"把资源注释掉会让 plan 提议销毁；正确做法是用 CLI 命令或 removed 块把对象从 state 中移除，让 Terraform 停止跟踪而 AWS 上的真实资源保留。"},{"t":"taint 强制重建","d":"资源进入无效或失败状态、但配置本身没改动时，用 terraform taint 标记后由下一次 apply 强制替换重建，用 untaint 取消标记。"}],"goal":"掌握 state 操作，安全重构代码、纳管已有资源与强制替换异常资源","lessons":[{"i":162,"t":"Introduction to State Manipulation","ex":false,"n":"梳理为什么需要操作 state：某个资源无故停止工作、已有基础设施想纳入管理、改标签会触发重建、以及要把资源移交给别的项目或停止跟踪；典型用例包括 taint 强制重建而无需改配置、强制解除卡住的状态锁、从远程后端拉取与推送状态文件，以及需要时的细致手工编辑。"},{"i":163,"t":"Refactoring Terraform Resources（任务预览）","ex":true,"n":"本练习讲如何重构 Terraform 配置，同时覆盖 CLI 命令与 moved 块两条路径，还包含列表与映射相关内容；给出练习的预期成果，可暂停前往 exercise 47 文件自行尝试再回来继续课程。"},{"i":164,"t":"Refactoring Terraform Resources","ex":true,"n":"新建 16-state-manipulation 目录，provider.tf 设 required_version 1.7、hashicorp/aws >=5.0 与 region us-east-1；在 moved.tf 说明移动资源有两种方式：terraform state mv 命令与 moved 块；先复制 aws_ami 数据源创建默认 EC2 实例，跑 terraform fmt -recursive、init 与 apply 验证，结束前记得销毁这两个实例。"},{"i":165,"t":"Importing Existing Infrastructure into Terraform（任务预览）","ex":true,"n":"本练习学习如何把现有基础设施导入 Terraform，强调这是非常实用的技能，建议也自己尝试一遍；视频给出预期目标，可先打开 exercise 48 文件动手，完成后回来继续观看课程。"},{"i":166,"t":"Importing Existing Infrastructure into Terraform","ex":true,"n":"在 16-state-manipulation 下新建 import.tf，说明导入也有两种方式：CLI 导入与 import 块；以课程早期为远程后端在控制台手工创建的 S3 桶为例，强调每个资源都有导入说明、应先查 provider 文档的 import 部分，并说明 import 块可放在被导入资源旁边，也可单独放一个文件。"},{"i":167,"t":"Removing Infrastructure from Terraform（任务预览）","ex":true,"n":"本练习讨论如何把基础设施从 Terraform 项目中移除、却不真正销毁它，适用于把资源迁到别的 Terraform 项目，或只是停止从当前配置跟踪某个资源；给出预期结果，可暂停前往 exercise 49 文件尝试。"},{"i":168,"t":"Removing Infrastructure from Terraform","ex":true,"n":"把 S3 桶与 aws_s3_bucket_public_access_block 注释掉后，plan 会显示 Terraform 想销毁它们；正确做法是用 CLI 命令或 removed 块把对象从 state 中移除，让 Terraform 放弃跟踪但保留真实资源；新建 removed.tf 演示，apply 后到 S3 页面确认桶还在，结尾手动删桶并说明 Terraform 不会重建。"},{"i":169,"t":"Replacing Resources with the Taint Command（任务预览）","ex":true,"n":"本练习学习 taint 与 untaint 命令：当资源因某些原因进入无效状态、但它在 Terraform 中的配置没有改变时，用它们强制替换资源；给出本练习的预期结果列表，可暂停前往 exercise 50 文件自行完成。"},{"i":170,"t":"Replacing Resources with the Taint Command","ex":true,"n":"新建 taint.tf 创建 aws_s3_bucket（桶名后加随机字符串）并 apply；演示在控制台删掉桶后再 apply 仍报找不到资源，说明一个 Terraform 资源可能是许多其他资源的依赖，不能随便手动删除；正确做法是 terraform taint 标记该资源，强制下次 apply 重建，结束后 terraform state list 已为空。"}]},{"n":15,"dir":"15 - Project - Importing Lambda Resources","stage":"阶段 7 · 项目","zh":"项目：导入 Lambda 资源","points":[{"t":"手工创建 Lambda 并盘点资源","d":"在控制台用 Hello World 模板创建函数并新建带基本 Lambda 权限的角色，再逐项检查后台生成了哪些资源，为后续导入建立清单。"},{"t":"导入 Lambda 函数本体","d":"建 project03 目录与 provider.tf，查 AWS provider 文档的 import 部分复制 import 块；此时 plan 会因缺 filename、image URI 或 S3 选项而失败。"},{"t":"导入函数代码：zip 打包","d":"Lambda 部署包只支持容器镜像或 zip 归档；filename 不能直接指向 JS 文件，需引入 archive provider 与 archive_file 数据源打包。"},{"t":"导入执行角色与信任策略","d":"从权限页取角色名导入 aws_iam_role，并用 aws_iam_policy_document 数据源生成 sts:AssumeRole 信任策略，替换硬编码的转义 JSON。"},{"t":"策略重构为 policy document","d":"把内联策略迁进 aws_iam_policy_document 数据源，resource 用 aws_caller_identity 与 aws_region 数据源限定账户与区域，行为保持不变。"},{"t":"导入 CloudWatch Log Group","d":"日志组不属于 IAM，放在 CloudWatch 文件中；查文档选 aws_cloudwatch_log_group 资源按名称 import，注意与只读 data source 的区别。"},{"t":"default_tags 与新增资源","d":"provider 加 default_tags 后四个资源批量打标；再新增 aws_lambda_function_url（授权 aws_iam 或 none），最后 destroy 验证纳管结果。"}],"goal":"完整走通一次已有服务纳管：把手工创建的 Lambda 及其角色、策略、日志组全部导入并重构","lessons":[{"i":171,"t":"Project Overview","ex":false,"n":"项目目标是把 Lambda 相关资源导入 Terraform：从在 AWS 控制台手工创建一个 Lambda 函数开始，先花时间识别创建函数时后台生成的全部资源（剧透：不止函数本身），再把它们逐个导入并重构成干净项目；建议尽量使用配置生成工具，并记住生成的代码仍需继续优化。"},{"i":172,"t":"Creating a Lambda Function Manually","ex":false,"n":"进入 Lambda 控制台点击创建函数，选 Hello World 模板，命名为手动创建的 Lambda，并新建一个带基本 Lambda 权限的角色；创建后逐项查看后台生成了哪些资源。强调配置生成是尽力而为、并不完美，但导入时能省下大量手写，也让资源数量与性质在 IaC 中变得透明。"},{"i":173,"t":"Importing the Lambda Function","ex":false,"n":"新建 project03_importLambda 目录与 provider.tf（required_version 至少 1.7、HashiCorp/aws 至少 5.0、区域 eu-west-1）并 terraform init；不手写 Lambda 资源而是靠代码生成，查文档中 aws_lambda_function 的 import 部分（Terraform 1.5 起支持 import 块）并复制过来；此时 plan 会失败，因为还缺 filename、镜像 URI 或 S3 存储桶选项。"},{"i":174,"t":"Importing the Function Code","ex":false,"n":"指出 Lambda 部署包只支持容器镜像或 zip 归档两种：filename 必须是本地 zip 包路径，不能直接指向 JS 文件，容器镜像则通过 image_uri 传 ECR 镜像地址；因此在 provider.tf 加入 archive provider（2.4）并再次 init，用 archive_file 数据源把 JS 打成 zip（输出命名 lambda_code）供函数引用，之后本地改代码、发布只需 terraform apply。"},{"i":175,"t":"Importing the Function Role","ex":false,"n":"从 Lambda 配置的监控和操作工具页找到 CloudWatch 日志组、从权限页找到角色名，先把执行角色导入：IAM 角色分信任关系（谁能承担）与权限（能做什么）两部分，代码要指向正确的基础设施对象才能只导入不修改；在 iam.tf 中写 aws_iam_role.lambda_execution_role 并粘贴控制台的角色名，plan 无变更说明只是导入，apply 确认即可。"},{"i":176,"t":"Importing the Role Policy","ex":false,"n":"不硬编码转义的 assume_role_policy JSON 与 managed_policy_arns：改用数据源 aws_iam_policy_document 生成 assume role 策略（assume_lambda_execution_role.json），用 EOT heredoc 多行字符串编写 statement，Action 为 sts:AssumeRole、Effect 为 Allow、Principal 指向 lambda.amazonaws.com，允许 Lambda 服务承担该角色；再把角色从托管策略 ARN 迁移到策略或角色策略附件，最后 terraform fmt。"},{"i":177,"t":"Refactoring the Imported Policy","ex":false,"n":"重构导入的内联策略：新建 aws_iam_policy_document 数据源，把 Effect Allow、logs:CreateLogGroup 等 action 与限定在该区域和该账户下的 logs resource 迁进配置，账户与区域分别用 data.aws_caller_identity.current.account_id 和 aws_region 数据源获取，并把策略文档命名为 lambda execution；重点是在不改变行为的前提下改进代码设计。"},{"i":178,"t":"Importing the CloudWatch Log Group","ex":false,"n":"在 CloudWatch 页面查看该 Lambda 的日志组、日志流与执行日志，明确重点是把这个日志组导入；在 provider 文档中搜 log_group，忽略自动扩展组等数据源，选 aws_cloudwatch_log_group 资源（只想引用不管理才用 data source），按名称复制 import 命令，写进 CloudWatch 相关文件并加描述，完成日志组导入。"},{"i":179,"t":"Creating Additional Resources and Project Wrap-Up","ex":false,"n":"先玩转已纳管的项目：在 provider 里加 default_tags（managed_by = Terraform、project = project three import lambda），apply 后正好有四个资源变更——Lambda 函数、执行角色、执行策略与 CloudWatch 日志组，数据源只读取不受影响，回控制台可见标签已更新；随后新增 aws_lambda_function_url，authorization_type 可选 aws_iam 或 none（none 即绕过 IAM 认证），最后 terraform destroy 销毁全部导入资源。"}]},{"n":16,"dir":"16 - Project - RDS Module","stage":"阶段 7 · 项目","zh":"项目：RDS 模块","points":[{"t":"拆解需求与校验点","d":"先建 project04 目录和 README.md，把要做的事列成清单：先理解 RDS 资源与它依赖的资源，再建标准结构的模块，然后实现并测试变量校验，全部通过后才部署实例。"},{"t":"AWS RDS 资源属性","d":"通读 aws_db_instance 的 provider 文档，关注实例类型、低停机时间更新和基本用法；不显式传参时 Terraform 会用默认 VPC、默认安全组和默认子网，必须自备并传入。"},{"t":"模块变量设计","d":"在 modules/rds 下拆成 variables.tf、outputs.tf、providers.tf；变量含 name、instance_class、storage_size、engine 等，可加默认值并直接写 validation 的 condition。"},{"t":"测试变量 validation","d":"在 project04 建 rds.tf 以 module + source 调用模块，先补齐必填变量和 provider 配置，再用 terraform validate 逐条确认 condition 真的会在非法输入时报错。"},{"t":"subnet_ids 与 sg_ids 变量","d":"不传子网与安全组就会落到 AWS 默认值，因此新增两个输入变量；注意变量的 validation 块做不了这种复杂校验，需要借助 data 源和 postcondition 另做方案。"},{"t":"默认 VPC 与私有标签校验","d":"模块内不创建子网，用 data aws_subnet 拿信息，在 postcondition 中确保子网不在默认 VPC，并检查 access 标签取小写后等于 private。"},{"t":"安全组规则校验","d":"先用 aws_vpc_security_group_rules 按安全组 ID 过滤拿到规则 ID，再 for_each 逐条评估，确保没有任何入站规则放行 IP 或 CIDR，流量只能来自其他安全组。"},{"t":"部署与清理","d":"用 locals 把 postgres-latest 等友好选项映射为 engine、version、family，创建 aws_db_subnet_group 与 aws_db_instance，最后一条 terraform destroy 按依赖顺序删掉全部资源。"}],"goal":"独立完成带变量与网络校验的生产级 RDS 模块，并正确销毁全部资源","lessons":[{"i":180,"t":"Project Overview","ex":false,"n":"项目目标是创建一个 RDS 模块，并定义所需的模块变量。本项目最关键的一点是会在校验上花很多功夫——安全是管理基础设施的重要方面，可以通过在 Terraform 代码里加入有意义的校验把安全内置进去。页面列出若干校验示例，要求你在模块中实现它们，并测试这些校验是否真的会生效。"},{"i":181,"t":"Defining the Necessary Steps and Validations","ex":false,"n":"在根目录新建 project04 文件夹，并先建一个 README.md 把步骤写下来：第一步理解 RDS 资源本身以及它还需要哪些必要资源；第二步创建一个标准结构的模块；第三步实现变量校验，变量通过校验后才去创建必要的资源。作者倾向于先做变量校验、保证输入有效，再部署 RDS 实例，且这份清单与各讲并不一一对应。"},{"i":182,"t":"Exploring the AWS RDS Resource in Terraform","ex":false,"n":"打开 AWS provider 文档里的 aws_db_instance 页面，关注实例类型、如何做低停机时间更新以及基本用法（示例为单可用区 db.t2.micro）。重点是：不给这些参数时 Terraform 会使用默认 VPC、默认安全组和默认子网来部署，所以要自备子网与安全组并传给 RDS 模块，这些都要变成模块变量。参数很多不必全讲，但要弄清它与底层 AWS RDS 数据库的对应关系。"},{"i":183,"t":"Defining Necessary Module Variables","ex":false,"n":"在 project04 下建 modules/rds（不想和实现耦合也可叫 database），内部分成 variables.tf、outputs.tf、providers.tf 三个文件而不是 main.tf；providers.tf 里写 terraform 块与 required_providers（source = hashicorp/aws，版本 >= 5.0）。在 project04 跑 terraform fmt -recursive；此时在 project04 执行 terraform init 什么都不会发生，因为 Terraform 只看当前工作目录，必须把目录当模块引入。变量从简单的 string name 开始，再加实例类型（带校验）、存储、engine。"},{"i":184,"t":"Testing Variable Validation","ex":false,"n":"在 project04 新建 rds.tf 以 module \"database\"（source = ./modules/rds）调用模块，先补齐必填变量与默认值：实例类型 db.t3.micro、storage_size 默认 10、engine 默认 postgres-latest；用户名密码故意不给默认值，传入弱密码 1234 观察报错。补上 providers.tf 后 fmt、init，再用 terraform validate 验证 condition 是否生效——用 contains 卡住非法引擎名，再补引擎与凭据组合校验，最后验证 storage_size 必须在 5 到 10 之间。"},{"i":185,"t":"Creating Module Variables for Subnet and Security Group IDs","ex":false,"n":"如果不给数据库实例传 subnet 组或安全组，资源就会使用 AWS 的默认值，所以要在 README 里新增第 4 点网络校验：4.1 通过变量接收 subnet_ids 与 security_group_ids；4.2 确保这些子网不在默认 VPC 中；4.3 确保传入的子网是私有的。实现方式是把 variables.tf 里的变量按组整理。这里留个伏笔——变量的 validation 块做不了这种复杂校验，需要更完善的方案。"},{"i":186,"t":"Implementing Default VPC Validation","ex":false,"n":"两个条件：子网不在默认 VPC 中、且是私有子网。私有性的判定方案是检查子网是否带 access=private 标签（值为 Private、PRIVATE 也算），不做更深入的路由表检查，由使用者负责打好标签。模块内并不创建子网，所以要加 data \"aws_subnet\"（示例命名 from_subnet_ids）来取信息。新建 networking_validation.tf 专门写这些校验，文件里先用注释划出子网校验，安全组校验照抄一份改成。"},{"i":187,"t":"Testing Default VPC Validation","ex":false,"n":"先在模块调用处把 subnet_ids 与 security_group_ids 传成空列表，让 terraform validate 通过；随后 networking.tf 会去取默认 VPC 的信息并发出网络请求。测试做法是创建 aws_subnet，把默认 VPC 中的子网 ID 传给 RDS 模块，预期校验报错。再用一个自定义 VPC 中的子网（输出 name 与 ID，供模块引用）验证 postcondition 确实放行，从而确认默认 VPC 校验生效。"},{"i":188,"t":"Implementing and Testing Private Tag Validation","ex":false,"n":"在已有的 postcondition 之外再加一个检查：子网必须带 access 标签且值等于 private。为覆盖边界情况，先用 tolower 把标签值转小写，再用 can(...) 兜住标签或 self.tags 本身不存在的情况。测试时准备 allowed 与 not_allowed 两个 aws_subnet，运行 terraform plan 确认不合规的那个触发 postcondition 失败，全部检查通过后在 README 里把该项标记完成。"},{"i":189,"t":"Implementing Security Group Rule Validation","ex":false,"n":"4.3 的校验目标是：传入的安全组不得有任何入站规则放行 IP 或 CIDR，流量只能来自其他安全组。因为收到的是安全组 ID 而非规则 ID，要分两步：先用 data \"aws_vpc_security_group_rules\"（注意是复数）配合 filter 按安全组 ID 过滤，拿到一组规则 ID（底层是 AWS 的 DescribeSecurityGroupRules），再用 for_each 配合 toset 对每条规则写 postcondition，逐条判定是否有来自 IP CIDR 的入站放行。"},{"i":190,"t":"Testing Security Group Rule Validation","ex":false,"n":"在模块外的 networking 文件里按注释分段创建测试资源：先写一个作为流量来源的源安全组，再建 compliant 与不合规两个安全组，并配合 aws_security_group_ingress_rule。注意创建安全组时必须传自定义 VPC 的 vpc_id，否则会落进默认 VPC，而安全组是按 VPC 划分作用域的，必须和 RDS 实例所在的自定义 VPC、子网保持一致。分别验证 plan 通过与报错。"},{"i":191,"t":"Understanding the Different Data Sources for Security Group Rules","ex":false,"n":"解释为什么这里用了 aws_vpc_security_group_rules（复数）而不是 aws_security_group_rule：前者能一次拿到一组规则 ID，便于配合 for_each 逐条评估；后者是单数形式，只能拿到单条规则。做法是把 RDS 模块里调用的两个安全组 ID 和 filter 挪到数据源上，观察行为差异，并说明两者底层调用的是同一个 AWS API，因此 filter 写法相似，可用性与执行计划表现一致。"},{"i":192,"t":"Deploying the RDS Instance","ex":false,"n":"在模块内新建 rds.tf：先用 locals 建一个 db_engine map，把对外友好的选项（postgres-latest、postgres14）映射为底层所需的 engine（postgres）、version（录制时 16.1）和 family（postgres16），也可以按点号拆版本号拼出 family，但直接写更清楚。然后建 aws_db_subnet_group 传 var.subnet_ids，再建 aws_db_instance，engine 取自 locals、db_subnet_group_name 指向 aws_db_subnet_group.this.name。"},{"i":193,"t":"Project Wrap-Up and Clean Up","ex":false,"n":"收尾阶段执行 terraform destroy，确保 RDS 实例不会一直运行、持续计费。plan 里会显示 13 个资源将被销毁，包括所有子网与子网组、模块内的 RDS 实例本身、参数组，以及网络部分创建的子网、安全组、安全组规则和 VPC。只需一条命令，Terraform 会自己处理依赖关系并按正确顺序销毁，其中耗时最长的是 RDS 实例。"}]},{"n":17,"dir":"17 - Terraform Workspaces","stage":"阶段 8 · 团队","zh":"工作区 Workspaces","points":[{"t":"CLI workspace 的作用","d":"用单一代码库管理多个环境：复用同一个配置目录，靠不同的 state 文件区分，减少代码重复，也不用安装多份 module 和 provider；切到某工作区后其他工作区的资源不会被纳入。"},{"t":"创建与切换 workspace","d":"terraform init 会自动创建 default 工作区；terraform workspace --help 看子命令，new 创建、list 列出、select 切换、show 查看当前；不能删除当前所处的工作区，必须先切走。"},{"t":"多 workspace 并行管理","d":"每个工作区对应独立的 state 文件（放在 terraform.tfstate.d 下的子目录），资源互不可见；配置中可用 terraform.workspace 表达式感知当前环境，把环境名拼进资源名。"},{"t":".tfvars 存环境差异配置","d":"用 touch 建 dev.tfvars、staging.tfvars、prod.tfvars 存放各环境差异值，apply / destroy 时用 -var-file 传入；这比在代码里堆 if 与三元表达式可维护得多。"},{"t":"资源与 workspace 清理","d":"逐个 terraform workspace select 进入目标工作区后 terraform destroy 销毁其资源，再 terraform workspace delete 删除工作区，对应的 state 子目录会随之消失。"}],"goal":"用 workspace 隔离 dev/staging/prod 三套环境，并用 tfvars 承载差异配置","lessons":[{"i":194,"t":"Introduction to CLI Workspaces","ex":false,"n":"工作区让你用单一代码库管理不同环境：复用同一个配置目录，用不同的 state 文件分别创建管理，既减少代码重复，也不用装多份 module 和 provider。CLI 中切换工作区后，其他工作区的资源不会被纳入考虑，形成隔离。Terraform 始终至少有一个工作区，init 时自动创建名为 default；大多数远程 backend 支持但并非全部（S3、Google Cloud 等标准 backend 支持）。强调 CLI 工作区与 Terraform Cloud 的工作区不是一回事。"},{"i":195,"t":"Creating Workspaces in the CLI（任务预览）","ex":true,"n":"本练习开始在 Terraform CLI 中使用工作区。再次强调 CLI 中的 Terraform 工作区与 Terraform Cloud 中的工作区不同，本课程两者都会涵盖。视频中提供了一份分步指南，想先自己动手的话可以暂停，前往练习 51 文件操作，再回来继续观看解答视频。"},{"i":196,"t":"Creating Workspaces in the CLI","ex":true,"n":"新建 17_workspaces 目录与 provider.tf：required_version 至少 1.7、required_providers 指定 hashicorp/aws 至少 5.0，并配置 AWS provider 区域（示例用 us-east-1）。terraform fmt 与 init 后探索 terraform workspace 命令，先用 --help 看子命令，workspace show 显示当前是 default，workspace list 列出所有工作区。之后先创建一个 aws_s3_bucket 资源，并加上 random provider 生成唯一后缀。"},{"i":197,"t":"Working with Multiple Workspaces（任务预览）","ex":true,"n":"本练习继续使用 Terraform CLI 的工作区，同时会讲到一些不好的做法——也就是使用工作区时不应该做的事情。视频给出分步指南，如果想先于讲解视频自己动手尝试，可以暂停本视频并打开练习 52 的文件，之后再回来继续课程。"},{"i":198,"t":"Working with Multiple Workspaces","ex":true,"n":"把 terraform.workspace 表达式的值加进 S3 桶名：default 工作区 apply 后桶名变成 workspaces-demo-default 加随机串；terraform workspace select dev 再 apply，桶名变成 workspaces-demo-dev。随后用 workspace new 建 staging 等更多工作区，甚至把 default 当 prod 用。反面做法是到处按 terraform.workspace 写 if 或三元表达式，加第四个工作区就难以维护，是一场噩梦。"},{"i":199,"t":"Using .tfvars to Store Workspace-Specific Configuration（任务预览）","ex":true,"n":"本练习探索如何用 .tfvars 文件存放工作区专属配置，从而让不同的工作区使用不同的配置值。视频中提供了本练习的分步指南，如果想先自己动手试一试，请在观看解答视频之前暂停本视频，前往 exercise 53 文件，然后再回来继续课程。"},{"i":200,"t":"Using .tfvars to Store Workspace-Specific Configuration","ex":true,"n":"先修掉那段糟糕代码。补充一点：除了 terraform workspace select，还可用环境变量 TF_WORKSPACE=staging 设置工作区，terraform workspace show 会读取它；设置该变量会优先于 select 的选择，取消后才能真正切到 prod。随后用 touch 建 prod.tfvars、dev.tfvars、staging.tfvars，在 variables.tf 里定义 variable bucket_count，通过 -var-file 传入对应文件，让 int 桶按工作区拿到正确值——别写三元表达式，用变量文件切换。"},{"i":201,"t":"Resource and Workspace Cleanup","ex":false,"n":"先 terraform workspace show 确认当前在 int 工作区，workspace list 显示连 default 共五个。从 dev 开始：workspace select dev 后运行 terraform destroy（也演示了把 alias 里的 apply 改成 destroy 的写法），再 workspace delete dev 会报不能删除当前工作区，先 select 回 int 才能删；最终回到默认工作区销毁资源，terraform.tfstate.d 下随各工作区配置增减的子文件夹也一并消失。"}]},{"n":18,"dir":"18 - Terraform Cloud","stage":"阶段 8 · 团队","zh":"Terraform Cloud","points":[{"t":"Terraform Cloud 是什么","d":"HashiCorp 提供的远程执行平台：变更审批的访问控制、安全的 state 与机密存储、资源图形化视图、组织内共享模块的私有 Registry、策略管控，以及 plan/apply 运行历史；分免费与付费两档，资源归入 workspace，workspace 再归入 project。"},{"t":"TFC Workspace 模型","d":"任何代码不关联 workspace 就无法放进 TFC；workspace 是 RBAC 核心，可按工作区授予读或写权限，付费计划还提供健康检查与告警。配置不再存本地磁盘，而是通过 API/CLI 推送或 VCS 拉取，变量传递方式也不同。"},{"t":"CLI 登录与 cloud 配置","d":"用 terraform login 打开浏览器授权，API 凭证写入本地文件；随后在 provider.tf 的 terraform/cloud 块里指定 organization 与 hostname，把本地项目与云端 workspace 绑定，目录不对会导致连错项目。"},{"t":"用环境变量认证 AWS","d":"运行实际发生在 TFC 的 agent 上，读不到本地环境变量，必须把 AWS_ACCESS_KEY_ID 与 AWS_SECRET_ACCESS_KEY 设为 workspace 作用域的环境变量；只适合实验，长期使用应换成 OIDC 短期凭证。"},{"t":"Workspace 变量与变量集","d":"区分 Terraform 变量与环境变量：代码里写 variable 定义并加 validation，再到 workspace 变量页用同名 key 注入值，可标记为 HCL；Variable Sets 能把同一组配置共享给多个 workspace。"},{"t":"State 历史与面板","d":"左侧 States 面板保留每次运行的状态快照，可逐个打开对比（随机 ID → S3 存储桶 → EC2 实例）；工作区概览还会列出资源与输出值，付费计划另有持续校验与自动漂移检测。"},{"t":"接入 GitHub 走 VCS 流程","d":"建私有仓库并加 .gitignore 与 README，授权 GitHub App，让 TFC 能访问该仓库；在项目下新建 VCS 驱动的 workspace 并选择仓库，之后每次 push 仓库变更都会自动触发一次 plan。"},{"t":"PR 触发 speculative plan","d":"从特性分支创建 Pull Request 后，TFC 自动对该 PR 跑一次 speculative plan；它挂在 PR 上而非 workspace 页面，用来判断这次改动会给真实基础设施带来什么影响，评审通过再合并到默认分支。"},{"t":"私有 Registry 发布模块","d":"在 TFC 首页的 Registry 点 publish module，选已装好的 GitHub App，按 terraform-<provider>-<name> 命名筛选出仓库并按 tag 发布；之后 source 指向 app.terraform.io 加组织与模块名即可引用私有模块。"},{"t":"清理工作区与模块","d":"在 Settings 的 Destruction and Deletion 中排队 destroy plan、输入 workspace 名称确认并 apply 清空资源，再取消发布私有模块、删除 workspace，让 Terraform Cloud 回到干净状态。"}],"goal":"用 Terraform Cloud 把 Terraform 接入远程执行、审批与团队协作流程","lessons":[{"i":202,"t":"What is Terraform Cloud","ex":false,"n":"Terraform Cloud 由 HashiCorp 提供，把 Terraform 执行放到安全的远程环境：提供基础设施变更审批的访问控制、安全的 state 与机密存储、所管资源的图形化展示、组织内共享模块的私有 Registry、策略管控，以及 plan/apply 运行历史。分免费与付费计划，资源组织到 workspace，workspace 再组织到 project；注意别把 CLI 的 workspace 概念套到 TFC 上。"},{"i":203,"t":"Terraform Cloud Workspaces","ex":false,"n":"workspace 是 TFC 中不可或缺的构建模块，任何代码不关联某个 workspace 就无法放上去；它同时是访问控制的核心，可按工作区给不同成员授予读或写权限，付费计划还提供基于工作区的健康检查与异常通知。本地配置存在磁盘上，而 TFC 的配置要通过 API 或 CLI 推送更新，变量传递方式也不同。"},{"i":204,"t":"Triggering Runs in Terraform Cloud","ex":false,"n":"触发 run 共四种方式：CLI、UI、关联的 VCS 仓库、Terraform API。CLI 驱动时 Terraform 文件和命令都在 TFC 之外执行，只与远程环境交互；UI/API 驱动时文件同样在外部，人进 UI 或调用 API 触发运行；VCS 方式则把文件放仓库、由仓库变更触发。Pull Request 触发的只是推测 plan，并没有 apply 的意图。"},{"i":205,"t":"- Creating a Workspace in Terraform Cloud（任务预览）","ex":true,"n":"本练习要在 Terraform Cloud 中创建第一个工作区，目标是熟悉从注册、选择工作流类型到命名的完整路径。视频先给出预期结果，可暂停后打开练习 54 的文件自行尝试，再回来对照解答。"},{"i":206,"t":"- Creating a Workspace in Terraform Cloud","ex":true,"n":"访问 app.terraform.io，没有账号就点底部「创建免费账户」，然后用 GitHub 登录（HashiCorp Cloud Platform 账户）。首次登录可取消引导，创建工作区时选择 CLI 驱动的工作流，命名为 terraform-cli 并加一句说明。讲师提醒：即使看起来像本地运行，实际都跑在 TFC 的 agent 上，输出只是流式回终端。"},{"i":207,"t":"- Logging into Terraform Cloud in the Terminal","ex":false,"n":"复制 terraform login 命令，在新建的 18-Terraform-Cloud 目录下执行——目录必须是打算与 workspace 关联的项目。Terraform 会请求 API 令牌、打开浏览器，输入 yes 同意后凭证被存入本地文件。接着新建 provider.tf，在 terraform/cloud 块中写出组织名与 hostname，完成本地 CLI 与 TFC 的集成。"},{"i":208,"t":"- Creating Our First Resource with Terraform Cloud（任务预览）","ex":true,"n":"本练习用 Terraform Cloud 创建第一个资源：一个简单的随机 ID。资源本身很简单，重点是理解每次创建资源时 Terraform Cloud 在整条流程中扮演的角色与介入点；练习 55 附有分步指南，可先自行尝试再看解答。"},{"i":209,"t":"- Creating Our First Resource with Terraform Cloud","ex":true,"n":"回到 TFC 页面确认上一个 run 已成功，虽然资源列表和输出值为空。新建 random.tf 定义随机 ID（byte_length 设为 4），清空控制台运行 terraform apply 触发一次 CLI 驱动的 run，plan 显示将新增 1 个资源。apply 处于等待确认状态，可在 CLI 批准，之后回到工作区概览就能看到资源与输出值。"},{"i":210,"t":"- Authenticating into AWS and Creating an S3 Bucket（任务预览）","ex":true,"n":"本练习演示如何在 Terraform Cloud 里用环境变量完成 AWS 身份验证并创建 S3 存储桶。讲师明确提醒不推荐在生产环境用这种方式，只适合实验或测试；课程后面会用一个完整项目配置 OIDC 获取动态凭证。本节也顺带展示 TFC 环境变量的用法，因此仍有价值。"},{"i":211,"t":"- Authenticating into AWS and Creating an S3 Bucket","ex":true,"n":"之前一直靠本地环境变量连 AWS，但代码跑在 TFC 的 agent 上，读不到那些变量。做法是到 IAM 控制台新建用途为「命令行界面（CLI）」的用户（名字填 Terraform Cloud）拿到访问密钥，再切到 TFC 的变量设置，把 AWS_ACCESS_KEY_ID 与 AWS_SECRET_ACCESS_KEY 作为 workspace 内有作用域的环境变量添加进去；实验完要尽快删除，长期请改用 OIDC 与短期凭证。"},{"i":212,"t":"- Working with Workspace Variables（任务预览）","ex":true,"n":"本练习专门讲 Terraform Cloud 的工作区变量，重点是如何设置变量值以及工作区变量提供了哪些可选项。视频先展示预期结果，可暂停后打开练习 57 的文件自己动手，再回来对照解答。"},{"i":213,"t":"- Working with Workspace Variables","ex":true,"n":"在 18-Terraform-Cloud 下新建 variable 文件定义 ec2_instance_type，类型 string，validation 要求它必须等于 t2.micro；复制变量名回到 TFC 变量页，用同名 key 添加变量值，可标记为 HCL。再建 compute.tf 用 data.aws_ami.ubuntu.id 创建名为 Terraform Cloud 的 aws_instance，确认 plan 后 apply，最后 destroy 并刷新确认实例已终止。"},{"i":214,"t":"- Exploring State and Other Workspace Information in Terraform Cloud","ex":false,"n":"左侧 States 面板列出了从 CLI 触发的每一次操作对应的状态快照：最早的状态里只有随机 ID，点下一个能看到新增的 S3 存储桶，再下一个是加入 EC2 实例（还带上了变量值 t2.micro），状态之间可对比差异。工作区概览还会显示资源与输出值列表；付费计划提供持续校验与自动漂移检测等功能。"},{"i":215,"t":"- Integrating a GitHub Repository with Terraform Cloud","ex":false,"n":"新建私有 GitHub 仓库 terraform-course-example-terraform-cloud（仓库不必公开），添加 README 和针对 Terraform 的 .gitignore。然后回到 TFC，在项目下创建新工作区，选择从 VCS 仓库配置，授权 GitHub App 让 Terraform Cloud 能访问这些仓库，界面会给出必要指引。推送后 TFC 自动跑了一次因无资源变更的 plan，并提供启动新 plan 的入口。"},{"i":216,"t":"- Creating a VPC and Subnet via VCS Integration（任务预览）","ex":true,"n":"本练习探索 Terraform Cloud 的 VCS 集成，并创建一个 VPC 和一个子网。目标是走通「代码推送 → TFC 自动运行 → 结果回显」的完整链路，练习 58 提供了分步指南，可先暂停自行尝试再回来对照解答。"},{"i":217,"t":"- Creating a VPC and Subnet via VCS Integration","ex":true,"n":"把仓库克隆到课程仓库同级目录，复用 18-Terraform-Cloud 里的 provider.tf 配置，删掉用不到的 random provider，并把 cloud 块的 workspace 改成 terraform-vcs，其余保持不变。variables.tf 里定义 vpc_cidr，networking.tf 里创建 aws_vpc（tf_cloud）和子网，再到 TFC 补上同名变量；push 后 run 自动 plan 通过，概览页确认两个资源都已创建。"},{"i":218,"t":"- Triggering Speculative Plans from Pull Requests（任务预览）","ex":true,"n":"本练习探索推测 plan（speculative plan）：在 VCS 工作流中每次创建 Pull Request 时，Terraform Cloud 都会自动生成一次，用于在合并前看清变更影响。练习 59 给出分步指南，可暂停后自行完成再回来查看解答。"},{"i":219,"t":"- Triggering Speculative Plans from Pull Requests","ex":true,"n":"在新分支上再加一个 aws_s3_bucket（bucket 名加随机数字串），用 git checkout -b 创建 s3 分支（分支说明写 feature-s3-add-new-bucket）并推送，再创建 Pull Request。TFC 会自动对该 PR 跑推测 plan，它挂在 PR 页面上而不是 workspace 页面下，用来评估改动对基础设施的影响，评审确认后再合并，并保留 PR 提出的变更历史。"},{"i":220,"t":"- Publishing Modules in Private Registries（任务预览）","ex":true,"n":"本练习聚焦 Terraform Cloud 的私有 Registry 功能：把前面章节开发的网络模块发布到私有 Registry 中，供组织内部引用。练习 60 给出分步指南，可先暂停自行尝试，再回来对照完整操作过程。"},{"i":221,"t":"- Publishing Modules in Private Registries","ex":true,"n":"在 TFC 首页（不在 workspace 下）的 Registry 点 publish，选择已安装的 GitHub App，TFC 会按 terraform-<provider>-<name> 的命名规则筛出可用仓库，选中 terraform-aws-networking，按 tag 发布且不开启 no-code provisioning。之后把 source 指向 app.terraform.io 加组织名与模块名即可引用。页面还能看到模块下的资源条目（包含 data 资源）以及引入 moved 块后 state 中资源位置的迁移。"},{"i":222,"t":"- Terraform Cloud Resource Cleanup（任务预览）","ex":true,"n":"本练习清理在 Terraform Cloud 中创建的所有内容，确保不留任何残留资源与配置。练习 61 提供分步指南，可暂停视频先自己动手，再回来查看完整的清理流程。"},{"i":223,"t":"- Terraform Cloud Resource Cleanup","ex":true,"n":"进入 workspace 的 Settings，在 Destruction and Deletion 下排队 destroy plan，需粘贴 workspace 名称确认，plan 显示三个待删除资源，确认并 apply 等销毁完成。接着到 Registry 取消发布私有模块（输入 delete 确认），最后删除 workspace，逐个检查两个 workspace 下已无资源，TFC 恢复干净。"}]},{"n":19,"dir":"19 - Project - Terraform Cloud OIDC","stage":"阶段 8 · 团队","zh":"项目：Terraform Cloud OIDC","points":[{"t":"在 AWS 建 OIDC IdP","d":"先到安全凭证页停用并删除此前给 TFC 用的长期访问密钥，再在 IAM 创建 Web identity 类型的身份提供商，provider 选 app.terraform.io、audience 与 Terraform Cloud 保持一致，并记下它的 ARN。"},{"t":"角色信任策略与权限","d":"创建 Web identity 角色，信任策略中填入 OIDC provider 的 ARN 与 app.terraform.io:sub 条件，限定组织、项目、workspace 以及 run phase（plan 与 apply 都要能 assume）；再附加 AdministratorAccess 策略。"},{"t":"CLI
